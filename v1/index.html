<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>"불가능하다"고 증명한 자리에서 — ACDC 2026 예선 리뷰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root {
  --W: 1280px; --H: 720px;
  --fg: #1a1a1a; --muted: #6c757d; --accent: #e63946; --strong: #c1121f;
  --line: #dee2e6; --th: #f1f3f5; --quote: #f8f9fa;
  --font: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'SFMono-Regular', Menlo, Consolas, 'Pretendard', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #2b2d31; overflow: hidden; font-family: var(--font); }

#viewport { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
body.notes-on #viewport { bottom: var(--notesH, 34vh); }
#stage { width: var(--W); height: var(--H); position: relative; transform-origin: center center; flex: none; }

/* 고정 격자: 제목 띠(위치·크기 고정, 축소 안 함) → 본문 → 하단 띠(각주 2줄 + 쪽번호, 높이 고정) */
.slide { position: absolute; inset: 0; background: #fff; color: var(--fg); visibility: hidden;
  display: flex; flex-direction: column; padding: 40px 64px 0; overflow: hidden;
  line-height: 1.5; letter-spacing: -0.01em; font-size: 26px; }
.slide.active { visibility: visible; }
.slide .head { flex: none; height: 74px; }
.slide .head h2 { margin: 0; white-space: nowrap; }
.slide .body { flex: 1 1 auto; min-height: 0; position: relative; margin-top: 20px; }
.slide .inner { transform-origin: top left; width: 100%; }
.slide .inner > :first-child { margin-top: 0; }
.slide .band { flex: none; height: 66px; display: flex; align-items: flex-end; gap: 24px; padding-bottom: 14px;
  border-top: 1px solid #f1f3f5; }
.slide .foot { flex: 1; min-width: 0; font-size: 15px; color: var(--muted); line-height: 22px; max-height: 44px; overflow: hidden; }
.slide .foot p { margin: 0; }
.slide .foot small { font-size: inherit; }
.slide .num { flex: none; font-size: 15px; line-height: 22px; color: #adb5bd; }
.slide .badge { position: absolute; right: 18px; top: 14px; font-size: 14px; font-weight: 700; color: #b08900;
  background: #fff6d6; border: 1px solid #f0d77a; border-radius: 999px; padding: 2px 10px; }

.slide h1 { font-size: 52px; letter-spacing: -0.03em; margin: 0 0 .3em; line-height: 1.25; }
.slide h2 { font-size: 38px; letter-spacing: -0.03em; margin: 0 0 .55em; line-height: 1.3;
  border-bottom: 3px solid var(--accent); padding-bottom: .22em; }
.slide p { margin: .45em 0; }
.slide ul, .slide ol { margin: .4em 0; padding-left: 1.3em; }
.slide li { margin: .22em 0; }
.slide strong { color: var(--strong); font-weight: 700; }
.slide a { color: #1864ab; text-decoration: none; }
.slide code { font-family: var(--mono); font-size: .88em; background: #f1f3f5; border-radius: 4px; padding: 0 .25em; }
.slide pre { background: #1e1e1e; color: #e9ecef; border-radius: 8px; padding: 14px 20px; font-size: 19px; line-height: 1.45; margin: .5em 0; overflow: hidden; }
.slide pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.slide table { border-collapse: collapse; width: 100%; font-size: 21px; margin: .45em 0; line-height: 1.4; }
.slide th { background: var(--th); font-weight: 700; text-align: left; }
.slide th, .slide td { border: 1px solid var(--line); padding: 6px 11px; vertical-align: top; }
.slide blockquote { border-left: 5px solid #adb5bd; background: var(--quote); margin: .55em 0; padding: 8px 18px; font-size: 24px; color: #343a40; }
.slide blockquote p { margin: .2em 0; }
.slide img { display: block; margin: .4em auto; max-width: 100%; height: auto; border-radius: 4px; }
/* 한 문단에 그림 여러 장 → 나란히 */
.slide p:has(> img + img) { text-align: center; margin: .4em 0; }
.slide p:has(> img + img) img { display: inline-block; vertical-align: top; margin: 0 .4em; max-width: 48%; }
.slide pre.mermaid { background: none; color: inherit; padding: 0; margin: .4em 0; text-align: center; font-family: var(--font); }
.slide pre.mermaid svg { max-width: 100%; height: auto; }

/* 표지 */
.slide.cover { padding: 0 96px; background: linear-gradient(135deg, #fff 60%, #fdecee); }
.slide.cover h1 { font-size: 64px; }
.slide.cover h2 { font-size: 34px; color: #495057; border: none; font-weight: 600; }
.slide.cover p { color: var(--muted); font-size: 24px; margin-top: 1.5em; }
.slide.cover .body, .slide.lead .body { display: flex; flex-direction: column; justify-content: center; margin-top: 0; }
.slide.cover .band, .slide.lead .band { border-top: none; }
/* 부 표지 */
.slide.lead { background: #1a1a1a; color: #fff; align-items: stretch; }
.slide.lead .body { align-items: center; }
.slide.lead h1 { font-size: 60px; text-align: center; color: #fff; }
.slide.lead .num { color: #6c757d; }

/* 하단 표시 */
#hud { position: fixed; right: 14px; bottom: 10px; color: #ced4da; font-size: 13px; z-index: 5; opacity: .75; user-select: none; }
body.notes-on #hud { display: none; }

/* 발표자 노트 */
#notes { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: var(--notesH, 34vh); background: #f8f9fa;
  border-top: 3px solid var(--accent); overflow: auto; padding: 14px 28px 24px; font-size: 18px; line-height: 1.65; color: #212529; z-index: 10; }
body.notes-on #notes { display: block; }
#notes .meta { display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: #6c757d; margin-bottom: 6px; }
#notes .meta .sec { font-weight: 700; color: #c1121f; }
#notes .meta .ttl { font-weight: 700; color: #212529; }
#notes .meta .next { margin-left: auto; }
#notes p { margin: .35em 0; }
#notes strong { color: #c1121f; }
#notes em { color: #6c757d; }
#notes table { border-collapse: collapse; font-size: 15px; }
#notes td, #notes th { border: 1px solid #dee2e6; padding: 3px 8px; }

@media print {
  @page { size: 1280px 720px; margin: 0; }
  html, body { background: #fff; overflow: visible; height: auto; }
  #viewport { position: static; display: block; }
  #stage { transform: none !important; width: auto; height: auto; }
  .slide { position: relative; visibility: visible !important; width: var(--W); height: var(--H); page-break-after: always; break-after: page; }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  #hud, #notes { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>
<div id="hud"></div>
<div id="notes"></div>
<script id="deck-data" type="application/json">[{"md": "# \"불가능하다\"고 증명한 자리에서\n## ACDC 2026 예선 리뷰 — 남이 푼 문제를 뜯어보다\n\n2026-11-12 / 팀 딸깍", "bonus": false, "title": "\"불가능하다\"고 증명한 자리에서", "notes": "오늘은 지난달 말에 나갔던 대회 얘기를 가져왔습니다.\nACDC(에이씨디씨)라는 대회인데요, KISA(키사)가 여는 AI 해킹방어대회입니다. 올해가 두 번째예요.\n\n제목이 좀 이상하죠. \"불가능하다고 증명한 자리에서.\"\n이게 오늘 하고 싶은 말 전부라서, 끝까지 들으시면 왜 이 제목인지 아실 겁니다.\n\n이 대회가 좀 특이한 게, 이름부터 \"AI 해킹방어대회\"라서 참가자가 AI를 쓰는 게 전제예요.\n저희 팀도 문제마다 Claude Code(클로드 코드) 세션을 하나씩 붙여서 돌렸고, 다른 팀들도 대부분 Claude나 Codex(코덱스)를 썼습니다.\n그러니까 오늘 보실 비교는 사실 사람 대 사람이라기보다, **비슷한 AI를 든 팀끼리의 비교**에 가깝습니다.", "section": "[0:00] 오프닝 — 2.1분"}, {"md": "## 오늘 할 이야기\n\n0. 15문제 중 4문제\n1. 대회 지도 — 누가 무엇을 풀었나\n2. 같은 문제, 다른 풀이 — 지문 · 소리 · 영상\n3. 우리는 어디서 막혔나\n4. AI 에이전트를 굴리는 법\n5. 그래서 다음엔\n\n> 같은 모델을 썼는데, 왜 갈렸을까?", "bonus": false, "title": "오늘 할 이야기", "notes": "순서는 이렇습니다. 대회가 어떻게 생겼는지 지도를 먼저 보고요,\n같은 문제를 여러 팀이 어떻게 다르게 풀었는지 세 문제를 비교하고,\n우리 팀이 어디서 막혔는지, 그리고 AI 에이전트(에이전트)를 어떻게 굴려야 하는지로 끝냅니다.\n\n질문 하나만 들고 들어가시면 됩니다.\n**같은 모델을 썼는데, 왜 갈렸을까?**", "section": "[0:00] 오프닝 — 2.1분"}, {"md": "## 15문제 중 4문제\n\n- 2026-10-31 09:00~17:00, 온라인 8시간, 4명\n- KISA 주최 AI 해킹방어대회, 올해 2회째\n- 우리가 푼 문제: **1 · 4 · 6 · 13**\n- 최종 순위: **87위** (4,275.826점)\n\n![w:820](img/00_스코어보드_87위.webp)\n\n그래서 **못 푼 11문제**를 다른 팀이 어떻게 풀었는지,\n공개된 글을 전부 읽었습니다. 그중 하나는 **우리 팀원이 대회 직후 쓴 글**입니다.", "bonus": false, "title": "15문제 중 4문제", "notes": "10월 31일 아침 9시부터 오후 5시까지, 온라인으로 8시간이었습니다. 저희 팀 이름이 '딸깍'이고 네 명이 나갔어요.\n\n결과부터 말씀드리면, **15문제 중에 4문제 풀었습니다.**\n1번, 4번, 6번, 13번이요. 최종 순위는 **87위**였습니다. 화면이 그날 스코어보드예요.\n\n그래서 이번 발표는 자랑할 게 별로 없습니다.\n대신 대회 끝나고 블로그에 올라온 풀이를 전부 찾아서 읽었어요. 다른 팀 글 세 곳, 그리고 저희 팀원이 대회 끝나자마자 쓴 글까지요.\n**우리가 못 푼 11문제를, 남들은 어떻게 풀었나.** 그걸 우리 기록이랑 나란히 놓고 봤습니다.", "section": "[0:00] 오프닝 — 2.1분"}, {"md": "# 1부. 대회 지도", "bonus": false, "title": "1부. 대회 지도", "notes": "*(→ 바로 넘기세요)*", "section": "[2:10] 1부 — 대회 지도 — 3.3분 (보너스 포함 5.4분)"}, {"md": "## 형식: Jeopardy 11 + KOTH 4\n\n| 유형 | 방식 | 이번 예선 |\n|---|---|---|\n| **Jeopardy** | 문제 풀고 플래그 제출, 푼 팀 많을수록 점수 감소 | 11문제 |\n| **KOTH** | 라운드마다 제출물끼리 겨뤄 순위 점수 | 4문제 |\n\nJeopardy 분류\n\n| 분류 | 뜻 | 문제 수 |\n|---|---|---|\n| Security for AI | AI를 공격한다 (인젝션, 메모리 오염…) | 7 |\n| AI for Security | AI로 푼다 (소리·영상·이미지 분석, 자동 익스플로잇) | 3 |\n| AI Platform Security | AI 서비스의 웹 취약점 | 1 |\n\n<small>CTF = 숨긴 정답 문자열(플래그)을 찾는 해킹 대회<\/small>", "bonus": false, "title": "형식: Jeopardy 11 + KOTH 4", "notes": "형식은 두 가지가 섞여 있었습니다.\n\n하나는 Jeopardy(제퍼디). 해킹 대회 CTF(씨티에프, Capture The Flag)에서 제일 흔한 형식인데요, 문제마다 점수가 있고, 풀면 플래그(플래그)라는 정답 문자열이 나옵니다. 이걸 제출하면 점수를 받아요.\n많은 팀이 풀수록 그 문제 점수가 깎이는 dynamic scoring(다이나믹 스코어링)이라, 쉬운 문제는 250점, 열 팀만 푼 문제는 900점 가까이 됐습니다.\n\n다른 하나는 KOTH(코스), King of the Hill(킹 오브 더 힐)입니다. 정답이 있는 게 아니라, 라운드마다 각 팀이 프로그램이나 모델을 내고, 그것끼리 겨뤄서 순위대로 점수를 받습니다. 10분마다 라운드가 도는 식이에요.\n\nJeopardy 쪽은 분류가 세 개였는데요,\nSecurity for AI(시큐리티 포 에이아이)는 **AI를 공격하는 문제**입니다. 프롬프트 인젝션(프롬프트 인젝션) 같은 거요. 이게 일곱 문제로 제일 많았고요.\nAI for Security(에이아이 포 시큐리티)는 반대로 **AI를 도구로 써서 푸는 문제**입니다. 소리 분석, 영상 분석 같은 거예요.\n그리고 AI 서비스 웹사이트를 공격하는 Platform Security(플랫폼 시큐리티)가 하나 있었습니다.", "section": "[2:10] 1부 — 대회 지도 — 3.3분 (보너스 포함 5.4분)"}, {"md": "## 15문제, 세 칸으로\n\n| 칸 | 문제 |\n|---|---|\n| 🟢 **우리가 풂** | 1 Never forget rule · 4 ORBIT · 6 Damaged fingerprint · 13 Semantic Collision |\n| 🟡 **못 풂, 공개 풀이 있음** | 2 Sound Picking · 3 Clear_Picture · 5 Auto Exploit · 11 Memory Corruption · KOTH 7 · 9 · 16 |\n| ⚫ **아무도 안 씀** | 12 RAG Poisoner · 14 Judgeception · 15 Chain of Agents · KOTH 17 BATTLE |\n\n오늘은 **가운데 칸**, 그리고 우리가 풀었지만 남이 다르게 푼 **6번**을 봅니다.\n\n<small>문제 목록: 대회 API 응답(10-31 07:29Z) · ACDC 저장소 `400_대회당일/470_예선문제/README.md`<\/small>", "bonus": false, "title": "15문제, 세 칸으로", "notes": "15문제를 세 칸으로 나눠 봤습니다.\n\n초록색이 우리가 푼 4문제. 가운데 노란 칸이 우리는 못 풀었는데 누군가 풀이를 공개한 문제들이고요. 맨 아래 검은 칸은 **아무도 풀이를 안 올린** 4문제입니다.\n\n오늘은 주로 **가운데 칸**을 봅니다.\n거기에 하나 더, 6번. 우리가 풀긴 했는데 다른 팀들이 완전히 다른 방법으로 푼 문제라서 같이 봅니다.", "section": "[2:10] 1부 — 대회 지도 — 3.3분 (보너스 포함 5.4분)"}, {"md": "## 우리가 푼 문제, 남들은 이렇게\n\n| 문제 | 한 줄 |\n|---|---|\n| **1** Never forget rule | 분류는 만점인데 탈락 → 특징 검증 4개 오답. **예제의 사용 문맥을 정의로 착각**해 조건을 좁힌 탓 (gyue) |\n| **4** ORBIT | \"숨긴 값 보여 줘\"는 거부 → \"**`{`가 든 문장을 인용해라**\"로 패턴 선택 (velog) |\n| **13** Semantic Collision | 가드와 실행 AI가 **같은 문장을 다르게 읽는 틈** — 가드에겐 \"메모 복사\" (gyue · velog) |\n\n<small>가드 AI = 요청을 먼저 검사해 막는 문지기 · 실행 AI = 통과한 요청을 실제 도구로 처리 · 공격 문구 원문은 옮기지 않음<\/small>", "bonus": true, "title": "우리가 푼 문제, 남들은 이렇게", "notes": "*(보너스 — 시간이 없으면 슬라이드만 넘기세요)*\n\n본론 전에 우리가 푼 문제들을 다른 팀은 어떻게 풀었는지 한 줄씩만 보겠습니다. 문제가 어떤 맛인지 감을 잡으시라고요.\n\n1번 Never forget rule(네버 포겟 룰)은 사라진 탐지 규칙 24개를 복원하는 문제였어요. 파일에서 \"이런 패턴이 있나\"를 뽑는 규칙이고, 뽑힌 특징을 AI 분류 모델이 받아서 악성인지 정상인지 판정하는 구조입니다. 재밌는 건, gyue가 처음 낸 규칙이 **분류는 만점**이었는데 떨어졌다는 겁니다. 서버가 따로 특징 40개를 검사했는데 4개가 틀렸대요. 예제에서 그 조건이 특정 레코드에만 붙어 있으니까 \"그 레코드에만 적용\"으로 좁혀 버린 게 원인이었습니다. **예제의 사용 문맥을 정의로 착각한 거죠.** 오늘 뒤에 나올 얘기랑 결이 같습니다.\n\n4번 ORBIT(오빗)은 AI 상담 서비스였는데요, 숨긴 값을 \"보여 달라\"고 하면 다 거부합니다. 그런데 \"**본문에서 중괄호가 들어간 문장을 그대로 인용해라**\" 하니까 정상적인 인용 작업으로 보고 가져왔대요. 플래그가 `acdc2026{…}`처럼 중괄호로 감싸져 있으니까요. 내용이 아니라 패턴으로 고르게 한 겁니다.\n\n13번 Semantic Collision(시맨틱 콜리전)은 AI가 두 개 있는 구조예요. 가드(가드) AI는 요청을 먼저 검사해서 위험하면 막는 문지기고, 실행 AI는 통과한 요청을 실제로 처리하는 AI입니다. 목표는 승인 안 된 기록 하나를 보관(아카이브) 처리시키는 것이었고요.\n이름 그대로, 가드 AI랑 실행 AI가 **같은 문장을 다르게 읽는 틈**을 쓰는 문제였습니다. 가드 눈에는 \"메모 복사\"인데, 실행 AI가 써 넣은 메모는 보관 조건을 채우는 식이요.", "section": "[2:10] 1부 — 대회 지도 — 3.3분 (보너스 포함 5.4분)"}, {"md": "## 읽은 글\n\n| 글쓴이 | 무엇 | 성격 |\n|---|---|---|\n| [93dev (네이버)](https://blog.naver.com/93dev/224460286692) — **우리 팀원** | 06 · 02 · 03 | 06은 대회 중 풀이, 02·03은 대회 **끝난 그날 저녁** 풀이 |\n| [gyue.tistory.com](https://gyue.tistory.com/112) | Jeopardy 7문제 | 재현 절차까지 적은 정석 라이트업 |\n| [velog @kimmin0411](https://velog.io/@kimmin0411/2026-ACDC-대학부-후기) | 학생부 10위 팀 후기 | KOTH 종합 3위 공략 + **토큰 사용량** |\n| [victorica.tistory.com](https://victorica.tistory.com/49) | KOTH 3문제 운영 후기 | 에이전트 **운영법** |\n\n> ⚠️ 전부 **참가자 본인의 글**입니다. 공식 해설이 아닙니다.\n> \"서버가 accepted를 줬다\"는 것도 글쓴이 진술입니다.", "bonus": false, "title": "읽은 글", "notes": "읽은 글은 이렇습니다.\n\n먼저 93dev(구삼데브), 네이버 블로그인데 **저희 팀원**입니다. 세 문제를 썼어요. 6번은 대회 중에 푼 거고, 2번이랑 3번은 대회가 끝난 **그날 저녁**에 마저 풀어서 올렸습니다. 오늘 이 글이 꽤 자주 나옵니다.\n\n다른 팀 글로는, gyue(규)라는 분 티스토리에 일곱 문제가 있었고요, 재현 절차까지 적은 정석 라이트업(라이트업)입니다. 라이트업은 대회 끝나고 쓰는 풀이 글을 말해요.\nvelog(벨로그)에 학생부 10위 팀 후기가 있는데, 이게 오늘 4부에서 많이 나옵니다. 토큰을 얼마나 썼는지 숫자로 남겨 뒀어요.\n그리고 victorica(빅토리카)라는 분이 KOTH 세 문제를 에이전트로 운영한 후기를 썼습니다.\n\n한 가지만 짚고 가겠습니다.\n**이건 전부 참가자 본인 글이지, 공식 해설이 아닙니다.**\n\"서버가 통과라고 했다\"는 것도 글쓴이 말이에요. 오늘 제가 \"정답\"이라고 할 때는 다 이런 뜻으로 들어 주세요.", "section": "[2:10] 1부 — 대회 지도 — 3.3분 (보너스 포함 5.4분)"}, {"md": "# 2부. 같은 문제, 다른 풀이", "bonus": false, "title": "2부. 같은 문제, 다른 풀이", "notes": "*(→ 바로 넘기세요)*", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 6. Damaged fingerprint — 문제\n\n- 손상된 합성 지문 **3장** + 손상 위치 **마스크**\n- 마스크 안만 고칠 수 있음. 밖은 원본과 **바이트 단위로 같아야**\n- 이미지마다 **PSNR · SSIM** 두 기준을 모두 넘어야 통과\n- 점수 = **0.65 × 가장 나쁜 흠집** + 0.35 × 평균 → 흠집 하나만 망쳐도 탈락\n- 실패하면 점수를 안 알려 줌 (오라클 없음). 새 배정은 무제한\n\n<small>PSNR = 픽셀값이 정답과 얼마나 가까운가 · SSIM = 모양이 얼마나 비슷한가 · 오라클 = 제출마다 점수를 알려 주는 창구<\/small>", "bonus": false, "title": "6. Damaged fingerprint — 문제", "notes": "첫 번째는 6번, Damaged fingerprint(대미지드 핑거프린트)입니다. 망가진 지문이요.\n\n손상된 지문 이미지 세 장을 줍니다. 그리고 어디가 손상됐는지 표시한 마스크(마스크)를 같이 줘요.\n마스크 안쪽만 고칠 수 있고, 바깥 픽셀은 원본이랑 한 바이트도 달라지면 안 됩니다.\n\n채점은 PSNR(피에스엔알)이랑 SSIM(에스에스아이엠) 두 개로 합니다. PSNR은 픽셀값이 정답이랑 얼마나 가까운지, SSIM은 모양이 얼마나 비슷한지예요. 세 장 전부, 두 기준 다 넘어야 통과합니다.\n\n까다로운 건 점수 합치는 방식이었습니다. **가장 못 고친 흠집 하나가 점수의 65%** 를 차지해요. 평균이 아무리 좋아도 한 군데 망치면 탈락입니다.\n그리고 떨어지면 몇 점이 모자란지 안 알려 줍니다. 제출할 때마다 점수를 알려 주는 창구를 오라클(오라클)이라고 부르는데, 그게 없었어요.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 6. Damaged fingerprint — 문제 (계속)\n\n![w:760](img/06_지문_손상_마스크_정답.png)\n\n**공통 출발점**: 문제가 준 복원 모델 **RidgeNet**을 그대로 내면 → **기준 미달**\n(gyue · 93dev 글, 우리 대회 중 세션이 확인)\n\n<small>RidgeNet = 손상 지문 + 마스크를 넣으면 빈자리를 채운 지문을 돌려주는 딥러닝 모델 · 그림: 문제가 제공한 검증용 예제 case1<\/small>", "bonus": false, "title": "6. Damaged fingerprint — 문제 (계속)", "notes": "*(→ 그림: 왼쪽 손상된 지문, 가운데 마스크의 흰 부분만 고칠 수 있고, 오른쪽이 정답 예제)*\n\n문제에서 RidgeNet(릿지넷)이라는 복원 모델을 줍니다. 손상된 지문이랑 마스크를 넣으면, 망가진 자리를 채운 지문을 돌려주는 딥러닝 모델이에요. 지문의 줄무늬, 융선(융선)을 이어 그리도록 학습돼 있습니다. 그런데 **이걸 그대로 돌려서 내면, 기준에 살짝 못 미칩니다.**\n일부러 그렇게 만든 거예요. 저희 팀도, gyue도 실제로 내 보고 떨어진 걸 확인했습니다.\n그러니까 이 문제는 \"주어진 모델보다 조금 더 잘하는 법\"을 찾는 문제였습니다.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 지문 하나, 길 셋\n\n| 팀 | 아이디어 | 무엇을 했나 |\n|---|---|---|\n| **gyue** | 데이터를 다시 쓴다 | 다른 세션에 **같은 지문의 다른 관측본**이 있다 → SIFT로 찾고 정합해 **멀쩡한 실제 픽셀**을 가져옴 |\n| **93dev (우리 팀)** | 오차만 배운다 | RidgeNet·LaMa 출력 → 작은 회귀기가 \"RidgeNet이 얼마나 틀렸나\"를 예측. 학습 데이터는 멀쩡한 영역에 **가짜 흠집**을 내서 만듦 |\n| **velog** | 고전 영상처리 | 주변에서 **융선 방향**을 읽고 그 방향으로 늘린 커널로 채움. 6번째 제출에서 통과 |\n| *우리 팀 다른 세션* | *막힘* | *Claude 세션: 고전 보정 전부 실패 → \"불가능 증명\" → STUCK* |\n\n> 딥러닝을 더 크게 돌린 팀은 없었다.\n\n덤: 플래그 문구는 **PDE**를 암시했지만, PDE로 푼 팀은 없음 — \"힌트처럼 보이는 미끼\"\n\n<small>LaMa = 지운 자리를 채우는 공개 이미지 복원 모델 · PDE = 이미지를 열 퍼지듯 번지게 해 줄무늬를 잇는 후처리<\/small>", "bonus": false, "title": "지문 하나, 길 셋", "notes": "여기서 세 팀이 전부 다른 길로 갔습니다.\n\ngyue는 **데이터를 다시 썼습니다.** 이건 두 장 뒤에서 자세히 볼게요.\n\n저희 팀 93dev는 **오차만 배웠습니다.** 이게 저희 팀이 6번을 푼 방법이고, 바로 다음 장에서 그림으로 보겠습니다.\n\nvelog 팀은 오히려 **고전적인 영상처리**로 갔습니다. 지문은 줄무늬가 일정한 방향으로 흐르잖아요. 주변에서 그 방향을 읽어서, 그 방향으로 길쭉한 붓으로 칠하듯 채웠어요. 여섯 번째 제출에서 통과했습니다.\n\n그리고 표 맨 아래 한 줄. 같은 날 저희 팀에서 이 문제를 따로 붙잡은 Claude(클로드) 세션이 하나 더 있었는데요, 그 세션은 \"막힘\"으로 끝났습니다.\n**같은 팀 안에서도 한쪽은 풀고, 한쪽은 \"불가능하다\"고 멈췄던 거죠.** 그 세션 얘기는 조금 뒤에 다시 합니다.\n\n눈여겨볼 건, **딥러닝을 더 크게 돌려서 푼 팀이 하나도 없다**는 겁니다.\n\n그리고 하나 재밌는 게, 이 문제 플래그 문구가 \"PDE(피디이)로 융선을 다시 잇는다\"는 뉘앙스였어요. PDE는 편미분방정식인데, 여기서는 이미지를 열이 퍼지듯 조금씩 번지게 해서 끊긴 줄무늬를 매끄럽게 잇는 후처리라고 보시면 됩니다. 문제에서 이 PDE 후처리 코드도 같이 줬고요.\n그런데 gyue도 저희도 PDE는 효과가 없었고, 93dev는 아예 \"플래그는 PDE를 암시하지만 실제로 통과한 건 그게 아니었다, 나중에 헷갈리지 않게 적어 둔다\"고 남겼습니다. **출제자가 깔아 둔 힌트처럼 보이는 것도 미끼일 수 있다**는 거죠.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 우리 팀 93dev의 길: 오차만 배운다\n\n```mermaid\nflowchart LR\n  D[손상 지문] --> B[RidgeNet 결과]\n  D --> L[LaMa 결과]\n  B --> F[픽셀마다 특징 60개]\n  L --> F\n  F --> G[그래디언트 부스팅<br/>RidgeNet이 얼마나 틀렸나 예측]\n  G --> O[RidgeNet 결과 + 예측한 오차<br/>= 제출]\n  N[멀쩡한 영역에<br/>가짜 흠집 내기] -. 정답을 아는 학습 데이터 .-> G\n```\n\n- 정답이 없는 실전 이미지에서도, **멀쩡한 부분은 정답을 안다** → 거기를 일부러 망가뜨려 학습 (자기지도)\n- 큰 모델을 새로 학습하지 않고, 기존 모델의 **오차만 고치는 작은 모델**을 붙임\n\n<small>그래디언트 부스팅 = \"이 픽셀 주변이 어두운가?\" 같은 단순한 질문 나무 수백 개를 이어, 앞 나무가 틀린 만큼을 다음 나무가 고치는 모델 · 93dev 글 (우리 팀원)<\/small>", "bonus": false, "title": "우리 팀 93dev의 길: 오차만 배운다", "notes": "*(→ 그림 왼쪽에서 오른쪽으로 따라가며 설명하세요)*\n\n93dev는 RidgeNet 출력을 버리지 않았습니다. 대신 \"RidgeNet이 여기서 얼마나 틀렸을까\"를 맞히는 작은 회귀 모델을 붙였어요.\n쓴 건 그래디언트 부스팅(그래디언트 부스팅)이라는 평범한 모델인데요, \"이 픽셀 주변이 어두운가?\" 같은 단순한 질문 나무를 수백 개 이어 붙여서, 앞 나무가 틀린 만큼을 다음 나무가 고치게 하는 방식이에요. 가볍고 표 형태 데이터에 강합니다.\n입력으로는 RidgeNet 결과에 LaMa(라마) 결과도 같이 넣었어요. LaMa는 사진에서 지운 물체 자리를 채울 때 많이 쓰는 공개 복원 모델입니다.\n재미있는 건 학습 데이터를 만든 방법인데요, 지문의 멀쩡한 부분에 **일부러 가짜 흠집을 냅니다.** 거기는 원래 답을 아니까, 고쳐 보고 정답이랑 비교해서 배울 수 있죠. 셀프 슈퍼바이즈드(자기지도) 학습이에요.\n\n핵심은 이겁니다. 실전 이미지는 정답이 없지만, **멀쩡한 부분은 정답을 압니다.** 그걸 일부러 망가뜨려서 학습 재료로 쓴 거예요.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## gyue의 길: 같은 지문은 다시 나온다\n\n```mermaid\nflowchart LR\n  A[새 쿠키로<br/>155개 세션 수집<br/>465장] --> B[SIFT + RANSAC<br/>같은 지문 찾기<br/>이미지당 5~8장]\n  B --> C[affine → optical flow<br/>돌리고 휘어서 정합]\n  C --> E[다른 장의 멀쩡한 픽셀<br/>+ RidgeNet 결과 섞기]\n  E --> S[제출 · 통과]\n```\n\n<small>SIFT = 회전·크기가 달라도 같은 점을 찾는 기법 · RANSAC = 잘못 짝지은 점을 걸러 내는 방법 · optical flow = 픽셀마다 어디로 움직였는지 계산<\/small>\n\n<small>gyue #116<\/small>", "bonus": false, "title": "gyue의 길: 같은 지문은 다시 나온다", "notes": "*(→ 흐름도를 왼쪽부터 짚으며 설명하세요)*\n\ngyue의 풀이가 제일 놀라웠습니다.\n\n이 문제는 브라우저 쿠키마다 다른 지문을 배정해 줍니다. 미리 만들어 둔 풀에서 뽑아 주는 거예요. 그리고 새로 배정받는 건 무제한이었습니다.\n\ngyue는 새 쿠키로 155번 배정을 받아서 지문 465장을 모았어요. 그리고 SIFT(시프트)라는 걸 돌렸습니다. 회전되거나 크기가 달라져도 같은 점을 찾아 주는 기법이에요. 엉뚱하게 짝지어진 점은 RANSAC(랜색)이라는 방법으로 걸러 냅니다.\n그 흐름이 이 그림입니다. 다음 장에서 실제로 어떻게 생겼는지 볼게요.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 같은 지문, 다른 흠집\n\n![w:760](img/06_같은지문_다른관측본_예시.png)\n\n<small>그림은 설명용 합성: 문제 제공 예제 1장을 돌리고 다른 마스크를 씌워 만듦<\/small>", "bonus": false, "title": "같은 지문, 다른 흠집", "notes": "*(→ 그림: 왼쪽 A와 오른쪽 B의 흰 흠집 위치가 다른 걸 짚어 주세요. 설명용으로 만든 그림이라고 한마디)*\n\n그랬더니 **내가 받은 지문이랑 같은 지문이 다른 세션에 5장에서 8장씩** 있었습니다. 조금 돌아가 있고, 크기가 다르고, 무엇보다 **손상된 위치가 달랐어요.**", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 같은 지문, 다른 흠집 (계속)\n\n- 배정 풀에 같은 지문이 **조금 돌아가고 크기가 다른 채로** 여러 번 들어 있었다 (gyue: 이미지당 5~8장)\n- 흠집 위치가 달라서, 내 지문에서 가려진 자리가 다른 세션 지문에서는 **멀쩡히 보인다**\n- 그 픽셀을 정합해서 가져오면 모델이 상상한 값이 아니라 **실제 픽셀**", "bonus": false, "title": "같은 지문, 다른 흠집 (계속)", "notes": "그러면 내 지문에서 망가진 자리가, 저쪽 지문에서는 멀쩡하게 보입니다.\n저쪽 이미지를 돌리고 휘어서 내 이미지에 딱 겹치게 정합(정합)한 다음 그 픽셀을 가져오면, 모델이 상상한 게 아니라 **실제 픽셀**이 들어가는 거죠. 이게 풀이였습니다.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 같은 데이터, 반대 결론\n\n| | 우리 기록 | gyue |\n|---|---|---|\n| 모은 양 | 121개 배정, 365장 | 155개 세션, 465장 |\n| 비교 기준 | 픽셀이 **똑같은가** | SIFT 특징점이 **맞는가** |\n| 찾은 것 | 바이트 동일 복제본만 | 복제본 제외 318장 중 **변형된 관측본** |\n| 결론 | \"상보 픽셀 복원은 **불가능(증명)**\" | **이게 풀이의 핵심** |\n\n> 계산은 맞았다. **\"같은 지문 = 같은 바이트\"라는 가정**이 결론을 정했다.\n\n그리고 이 \"증명\"은 다음 세션 프롬프트에 **\"불가 증명, 반복하지 마라\"** 로 실려 넘어갔다.\n\n<small>추가로: 통과 기준이 배정마다 RidgeNet보다 +0.4~2.9dB로 달랐다 → 재배정도 길이었을 가능성 (추정) · 상보 픽셀 복원 = 다른 장에서 멀쩡한 픽셀을 빌려 오기<\/small>", "bonus": false, "title": "같은 데이터, 반대 결론", "notes": "그런데 여기서 저희 기록을 열어 보면요.\n\n저희 에이전트도 똑같은 생각을 했습니다. 121번 배정을 받아서 365장을 모았어요. gyue랑 거의 같은 규모입니다.\n그리고 내린 결론이 이겁니다. \"같은 원본은 항상 같은 마스크로 나온다. 그러므로 **상보 픽셀 복원은 불가능하다. 증명.**\"\n상보 픽셀 복원이 바로 방금 gyue가 한 것, 다른 장에서 멀쩡한 픽셀을 빌려 오는 방법입니다.\n\n차이는 비교 기준이었습니다.\n저희는 **픽셀이 똑같은지**로 묶었어요. 그러면 바이트까지 똑같은 복제본만 걸립니다. 복제본은 당연히 마스크도 똑같죠.\ngyue 글에도 \"정확히 같은 PNG를 빼면 318장\"이라는 문장이 있습니다. 그 복제본들은 gyue도 봤어요. 그걸 빼고 남은 데서, 살짝 돌아간 **변형본**을 찾은 겁니다.\n\n**계산은 맞았습니다. \"같은 지문이면 바이트도 같다\"는 가정이 결론을 정했습니다.**\n\n그리고 더 아픈 건 그다음이에요. 이 \"불가 증명\"이 다음 세션한테 넘기는 프롬프트에 그대로 실렸습니다. \"이건 이미 증명됐으니 반복하지 마라.\"\n그러니까 다음 에이전트는 이 방향을 아예 안 쳐다봤습니다.\n\n하나 더 보탤게요. 저희 기록을 보면 velog 팀이 한 \"방향장 따라 채우기\"도 해 봤습니다. Gabor(가보) 필터로요. 특정 방향, 특정 굵기의 줄무늬에만 반응하는 필터입니다.\n그리고 \"이 입력으로는 정보 천장이라 아무 방법도 1dB을 못 넘는다\"고 결론냈어요. 정보 천장, 그러니까 입력에 담긴 정보로는 더 좋아질 수 없는 한계라는 거죠.\n그런데 velog 팀은 비슷한 방법으로 통과했습니다. 왜 그랬을까 보니까, 통과 기준이 **배정마다 달랐어요.** 저희가 재 본 것만 해도 RidgeNet보다 0.4dB 위인 배정부터 2.9dB 위인 배정까지 있었습니다.\n배정은 무제한으로 다시 받을 수 있었으니까, 어쩌면 **쉬운 배정을 받을 때까지 다시 뽑는 것**도 길이었을지 모릅니다. 이건 제 추정이에요.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 2. Sound Picking — 문제\n\n- 열쇠를 자물쇠에 꽂는 **소리**(6초 × 6번 녹음)\n- 홈 **10개**의 깊이(0~3)를 맞혀라\n- 정답을 아는 기준 열쇠 64개 제공\n- 3단계 × 열쇠 3개. **30자리 전부** 맞아야 다음 단계 (부분 점수 없음)", "bonus": false, "title": "2. Sound Picking — 문제", "notes": "두 번째는 Sound Picking(사운드 피킹). 소리로 자물쇠를 따는 문제입니다.\n\n열쇠를 자물쇠에 꽂을 때 나는 소리를 6초짜리로 여섯 번 녹음해서 줍니다. 그걸 듣고 열쇠 홈 열 개의 깊이를 맞혀야 해요. 깊이는 0에서 3까지.\n정답을 아는 기준 열쇠 64개의 녹음도 줍니다. 학습 데이터죠.\n3단계가 있고 단계마다 열쇠 세 개라서, 한 단계에 30자리를 **전부** 맞혀야 다음으로 넘어갑니다. 부분 점수 없어요.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 2. Sound Picking — 문제 (계속)\n\n![w:900](img/02_소리_스펙트로그램.png)\n\n<small>스펙트로그램 = 가로 시간 · 세로 주파수 · 진할수록 큰 소리. 6kHz 점은 0.5초 간격 표시음, 2~4kHz 덩어리가 열쇠 소리 · 문제가 준 기준 열쇠 녹음으로 직접 그림<\/small>\n\n모두의 첫 시도: **\"홈 하나 = 소리 한 구간\"** 으로 깊이 분류\n→ 우리도, velog도 **자리별 30%대 벽** (찍어도 25%)", "bonus": false, "title": "2. Sound Picking — 문제 (계속)", "notes": "*(→ 스펙트로그램: 위쪽 6kHz 점들이 0.5초 간격 표시음, 2~4kHz의 짧은 가로줄들이 열쇠 소리라고 짚어 주세요. 열쇠 소리가 빨간 칸에 딱 맞춰 들어가지 않는 게 보입니다)*\n\n다들 처음에 똑같이 했습니다. 녹음을 열 구간으로 잘라서, 구간 하나가 홈 하나라고 보고 깊이를 분류했어요.\n저희도, velog 팀도 **자리별 정확도 30%대**에서 막혔습니다. 찍어도 25%인 문제에서요.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 깊이 말고 이동\n\n![w:900](img/02_열쇠_깊이_이동_예시.png)\n\n- 소리는 **깊이**가 아니라 **경계를 넘을 때** 난다 (93dev, 우리 팀원)\n- 그래서 \"이전 깊이 → 현재 깊이\" **전이 7종**을 분류 (gyue)\n- 구간마다 따로 맞히지 않고, **앞뒤가 이어지는 경로**로 10자리를 고름 (동적계획법)\n- 2단계: 채널 시간축 약 1% 늘어남 보정 / 3단계: **가짜 열쇠 소리 분리**\n\n⚠️ 같은 열쇠 반복 녹음을 검증 **전에** 함께 정렬하면 검증 정보가 샌다 → 열쇠 단위로 묶어서 홀드아웃 (gyue)\n\n<small>gyue #115 · 93dev (우리 팀원, 대회 후)<\/small>", "bonus": false, "title": "깊이 말고 이동", "notes": "공개된 풀이 두 편의 공통점은 이겁니다.\n**소리는 깊이에서 나는 게 아니라, 경계를 넘을 때 난다.**\n\n깊이 0에서 2로 가면, 1이랑 2 사이 경계를 두 번 넘으니까 '딸깍' 두 번이에요. 3에서 0으로 내려가면 세 번. 깊이가 그대로면 소리가 안 납니다.\n그래서 \"이 홈이 몇이냐\"가 아니라 \"**앞 홈에서 이 홈으로 얼마나, 어느 방향으로 움직였냐**\"를 분류해야 했던 거예요.\n\n그리고 구간을 하나씩 따로 맞히지 않고, 앞뒤가 말이 되는 경로를 통째로 고릅니다. 비터비(비터비) 같은 동적계획법이요. 홈마다 나온 확률을 이어 붙여서, 전체로 가장 그럴듯한 열 자리를 고르는 겁니다.\n\n2단계부터는 스테레오 녹음이었는데, 왼쪽 오른쪽 중 한쪽 채널의 시간축이 1% 늘어나 있었고, 3단계에서는 아예 가짜 열쇠 소리가 섞여 있어서 그걸 분리해야 했습니다. 1단계만의 문제가 아니었던 거죠.\n\ngyue 글에 저희가 새겨들을 만한 경고가 하나 있었어요. 같은 열쇠의 반복 녹음 여섯 개를 **검증 전에 같이 정렬하면, 검증 데이터 정보가 학습에 새어 들어간다.** 시험 문제를 미리 본 셈이죠. 그래서 같은 열쇠 녹음은 통째로 묶어서 빼고 검증해야 한다고요.\n정확도 85%, 99%, 이런 숫자가 나와도 **어떻게 나눠서 잰 숫자인지**를 봐야 한다는 얘기입니다. 이 스터디에서 논문 볼 때 늘 하는 얘기랑 똑같죠.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 우리 팀 타임라인\n\n| 시각 (KST) | 일 |\n|---|---|\n| 오전~오후 | CNN · CTC · LDA… 전부 자리별 30~37% |\n| 오후 | 한 세션: **\"오디오 디코딩은 정량적으로 막혀 있다\"** |\n| 15:57 | 병렬 검증: \"소리가 **앞쪽 깊이 전체**에 좌우된다\" 발견 |\n| **17:00** | **대회 종료** |\n| **17:01** | 다른 세션 커밋: **전이쌍 디코더, 자리별 85%** |\n| 20:45 | 팀원 93dev, **세 단계 모두 풀고** 글 게시 (대회 후, 점수 없음) |\n\n- 1단계 후보: 자신 있던 두 열쇠가 **각각 1자리씩** 틀림\n- 그 뒤에 2·3단계가 더 있었음\n\n> \"1분 차이로 놓쳤다\"가 아니다. **방향은 맞았고, 늦었다.** 그리고 그날 밤 끝까지 갔다.\n\n<small>돌파구 세션은 GPU 박스가 죽어 로컬 CPU로 넘어온 세션 — 큰 모델 대신 25ms 단위로 데이터를 직접 들여다봄 · CTC = 음성 인식에서 소리를 글자열로 바꾸는 학습법 · LDA = 클래스가 가장 잘 갈리는 축을 찾는 통계 기법<\/small>", "bonus": false, "title": "우리 팀 타임라인", "notes": "저희 쪽 시간표를 보시면요.\n\n오전부터 오후까지 CNN(씨엔엔), CTC(씨티씨), LDA(엘디에이), 생각나는 건 다 돌렸는데 30%대에서 안 움직였습니다.\nCTC는 음성 인식에서 소리를 글자열로 바꿀 때 쓰는 학습법이고, LDA는 클래스가 가장 잘 갈리는 축을 찾는 고전 통계 기법이에요. 딥러닝부터 통계까지 다 해 봤다는 얘기입니다.\n그러다 오후에 한 세션이 이런 결론을 냈어요. \"**오디오 디코딩은 정량적으로 막혀 있다.**\" 수치까지 붙여서요.\n\n그런데 같은 시간에 돌던 다른 세션이 3시 57분에 이런 걸 발견합니다. \"소리가 그 홈 하나가 아니라 **앞쪽 깊이 전체**에 따라 달라진다.\"\n이게 사실 \"이동\"이라는 정답 방향이었어요.\n\n대회는 5시에 끝났습니다.\n그리고 **5시 1분에, 전이쌍 디코더로 자리별 85%라는 커밋이 올라왔습니다.**\n전이쌍은 \"앞 홈 깊이, 지금 홈 깊이\" 짝을 말합니다. 아까 본 \"이동\"을 읽는 방식이죠.\n\n여기서 \"1분 차이로 놓쳤다\"고 하면 멋있는데, 그건 아닙니다.\n그때 나온 1단계 후보를 공개 풀이 정답이랑 대 봤더니, 제일 자신 있던 열쇠 두 개가 **각각 한 자리씩** 틀려 있었어요. 그리고 그 뒤에 2단계, 3단계가 더 있었죠.\n\n**방향은 맞았고, 늦었습니다.** 이게 정확한 표현입니다.\n그리고 같은 문제에 대해서 한쪽 세션은 \"불가능 증명\", 다른 쪽은 \"돌파구\"를 거의 같은 시각에 쓰고 있었다는 것. 이건 3부에서 다시 얘기하겠습니다.\n\n하나 덧붙이면, 그 돌파구가 나온 세션은 원래 쓰던 GPU 서버가 죽어서 로컬 CPU로 넘어온 세션이었어요. 큰 모델을 못 돌리게 되니까, 오히려 데이터를 25밀리초 단위로 쪼개서 \"어느 시점에 어떤 정보가 있나\"를 직접 들여다봤고, 거기서 구조가 보였습니다.\n**모델을 바꾸기 전에 데이터 구조부터 봐라.**\n\n그리고 이 얘기에는 뒷부분이 있습니다. 대회가 끝난 그날 밤, 저희 팀원 93dev가 이 문제를 **세 단계까지 다 풀었어요.** 8시 45분에 글이 올라왔습니다. 점수는 0점이지만, 서버에서 \"모든 자물쇠가 열렸다\"는 판정까지 확인했습니다.\n93dev가 쓴 방법도 \"경계를 넘을 때 소리가 난다\", 같은 축이었고요. 글 마지막 문장이 \"모델을 바꾸기 전에 녹음의 구조부터 살펴봐야 한다\"는 거였습니다.\n그러니까 방향이 맞았다는 건, 저희 팀이 그날 밤 스스로 확인한 셈입니다.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 3. Clear_Picture — 문제\n\n- MP4 하나. 1080×1080, 49프레임\n- 벚꽃나무 둘레에 십이지 동물 12마리, 카메라가 25° 높이에서 한 바퀴\n- 설명: *\"자연과 동물이 함께하는 아름다운 장면입니다.\"*\n- 접속 서버 없음. 파일 안에서 찾아야 함\n\n![w:420](img/03_원본프레임.png)\n\n<small>문제 영상의 첫 프레임<\/small>", "bonus": false, "title": "3. Clear_Picture — 문제", "notes": "*(→ 그림: 문제 영상 첫 프레임. \"여기 어디에 플래그가 있을까요?\" 하고 2초 쉬세요)*\n\n세 번째는 Clear_Picture(클리어 픽처).\n\n4초짜리 영상 하나를 줍니다. 벚꽃나무가 있고 둘레에 십이지 동물 열두 마리가 있어요. 카메라가 비스듬히, 25도 높이에서 나무 둘레를 한 바퀴 돕니다.\n설명은 딱 한 줄. \"자연과 동물이 함께하는 아름다운 장면입니다.\"\n접속할 서버도 없어요. 이 파일 하나에서 플래그를 찾아야 합니다.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 위에서 보면 QR\n\n1. 이웃 프레임 = **스테레오 쌍** → 시차로 3D 점 복원 (gyue)\n   또는 48시점으로 **Gaussian Splatting** (93dev, 우리 팀원)\n2. 분홍 꽃 점만 골라 **위에서 내려다본 밀도 지도**\n3. 모서리 사각형 3개 → **QR 버전 3 (29×29)**\n4. 흐린 칸은 흑백으로 단정하지 않고 **확률 그대로** → Reed–Solomon 오류정정\n\n<small>Gaussian Splatting = 작은 반투명 색 덩어리 수십만 개로 장면을 다시 쌓는 3D 복원 · Reed–Solomon = 일부가 가려져도 읽히게 붙여 둔 QR의 여분 정보<\/small>", "bonus": false, "title": "위에서 보면 QR", "notes": "답은 **나무를 위에서 내려다보는 것**이었습니다. 이것도 대회 끝나고 저희 팀 93dev가 \"위에서 보면 QR이래\"라는 귀띔을 듣고, 그날 저녁에 풀었습니다.\n\n카메라가 돌면서 찍었으니까, 이웃한 두 프레임을 왼눈 오른눈처럼 쓸 수 있어요. 스테레오(스테레오)죠. 그 차이로 꽃 하나하나의 3D 위치를 복원합니다. gyue는 이렇게 했고, 93dev는 가우시안 스플래팅(가우시안 스플래팅)으로 했어요. 여러 각도에서 찍은 사진으로 장면을 작은 반투명 색 덩어리 수십만 개로 다시 쌓아 올리는 3D 복원 기법입니다.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 위에서 보면 QR (계속)\n\n![w:400](img/03_위에서본_꽃밀도_QR.png) ![w:400](img/03_QR_29격자.png)\n\n<small>왼쪽: 우리 팀이 대회 후 만든 \"위에서 본 꽃 밀도\", 세 모서리의 네모가 QR 위치 표식 · 오른쪽: 같은 지도에 29×29 칸을 맞춘 것<\/small>\n\n<small>gyue #112 · 93dev (우리 팀원, 대회 끝난 그날 저녁, 공식 판정 없음) · 두 글이 다른 방법으로 같은 문자열에 수렴<\/small>", "bonus": false, "title": "위에서 보면 QR (계속)", "notes": "*(→ 그림: 세 모서리의 네모를 손으로 가리키세요. 이 그림은 저희 팀이 대회 후에 만든 것입니다)*\n\n그다음 분홍색 꽃 점만 골라서 위에서 내려다본 지도를 그리면, QR(큐알) 코드 모서리에 있는 큰 사각형 세 개가 나타납니다. 스캐너가 \"여기 QR이 있다\" 하고 위치를 잡는 표식이에요.\n꽃의 높낮이로 QR 코드를 새겨 놓은 거예요. 옆에서 비스듬히 보면 그냥 몽글몽글한 꽃 덩어리고요.\n\n마지막에 흐릿한 칸이 많아서, 93dev 말로는 한 번 흑백으로 바꿔 스캔하는 것만으로는 안 읽혔대요. 그래서 두 사람 다 칸마다 \"검은색일 확률\"을 그대로 들고 가서 QR에 들어 있는 오류정정, Reed–Solomon(리드 솔로몬)으로 복구했습니다. QR은 일부가 가려지거나 더러워져도 읽히게 여분 정보를 붙여 두는데, 그 방식 이름이 리드 솔로몬이에요.\n이렇게 흑백을 단정하지 않고 확률을 그대로 쓰는 걸 소프트 디코딩(소프트 디코딩)이라고 합니다.\ngyue랑 93dev가 서로 다른 방법으로 복원했는데 같은 문자열에 도착했습니다.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 우리는 3D까지 갔다\n\n![w:560](img/03_우리_3D복원_옆에서.png)\n\n![w:760](img/03_대회중_위에서본_렌더.png)\n\n<small>위: 대회 중 우리가 만든 3D 복원을 8개 각도에서 렌더 · 아래: 같은 복원을 **위에서**(왼쪽 두 장)와 옆에서 본 것. 위에서도 봤지만 **색**으로 봤다 — QR은 꽃 색이 아니라 **높이 요철**로 새겨져 있었다(대회 후 확인)<\/small>", "bonus": false, "title": "우리는 3D까지 갔다", "notes": "*(→ 그림: 위는 8개 각도 렌더, 아래 왼쪽 두 장은 위에서 본 렌더. \"QR은 바로 이 꽃 덮개에 있었습니다\")*\n\n그럼 대회 중의 저희는요, 사실 꽤 멀리 갔습니다.\n\n메타데이터, 스테가노그래피, 워터마크, 글자 인식, 다 했고요. 이미지 포렌식에서 하는 건 거의 다 했어요.\n**3D 복원까지 했습니다.** 꽃을 지우고 안에 뭐가 숨어 있나 렌더링까지 해 봤어요.\n위에서도 봤습니다. 아래 그림 왼쪽 두 장이 대회 중에 저희가 위에서 렌더한 거예요.\n그런데 **색**으로 봤습니다. 대회 끝나고 알고 보니 QR은 꽃 색이 아니라 **높이 요철**, 검은 칸 자리 꽃기둥이 조금 더 솟은 걸로 새겨져 있었어요. 색으로 렌더한 그림엔 그냥 분홍 덩어리였죠.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 높이별로 잘라도 봤다\n\n![w:900](img/03_대회중_높이별_단면.png)", "bonus": false, "title": "높이별로 잘라도 봤다", "notes": "*(→ 그림: 높이별 단면. \"이렇게 층층이 잘라 보기까지 했습니다\")*\n\n높이별로 잘라 보기까지 했습니다. 결론은 \"숨은 물체 없음, 캐노피는 속이 빈 껍질\".\n왜 이 단계에서 안 잡혔는지는 솔직히 확실하지 않습니다. 복원 해상도 문제였을 수도 있고, 볼 생각을 안 한 것일 수도 있고요.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "## 높이별로 잘라도 봤다 (계속)\n\n| 시도 | 결과 |\n|---|---|\n| 메타데이터 · 스테가노그래피 · 워터마크 · OCR | 없음 |\n| **3D 복원 → 위·옆 렌더, 높이별 단면** | \"숨은 물체 없음\", 캐노피는 \"껍질형 구\" |\n| 5차 분석 메모 | \"캐노피에 **규칙적 대각 격자**(벚꽃 절차적 배치)\" |\n| 플래그 추측 제출 | 십이지 이름 조합 등 **9건, 전부 오답** |\n\n- velog의 Claude도 초반에 \"나무 꼭대기에 **블록 패턴**\"을 짚었다가, 확대 후 \"틈새로 배경이 비치는 것\"이라며 넘김\n- 대회 끝나고 \"위에서 보면 QR\" 귀띔을 들은 팀원 93dev가 **그날 저녁** 복원. 단순 이진화로는 안 읽혀서 **확률 그대로** 오류정정\n\n> 격자를 **봤다**. 그리고 설명해 버렸다.\n\n<small>스테가노그래피 = 그림 속에 데이터를 숨기는 기법<\/small>", "bonus": false, "title": "높이별로 잘라도 봤다 (계속)", "notes": "그리고 다섯 번째 분석 메모에 이런 문장이 있습니다. \"캐노피에 **규칙적인 대각 격자**가 보이나, 벚꽃의 절차적 배치로 보임.\"\n프로그램이 꽃을 규칙대로 뿌렸으니 격자가 보이는 게 당연하다, 이렇게 해석한 거죠.\n**격자를 봤습니다. 그리고 설명해 버렸습니다.**\n\n저희만 그런 게 아니에요. velog 팀 Claude도 초반에 \"나무 꼭대기에 블록 패턴이 보인다\"고 짚었다가, 확대해 보더니 \"틈새로 배경이 비치는 거네요\" 하고 넘어갔대요.\n\n그리고 막히니까 에이전트가 추측을 하기 시작합니다. \"십이지니까 동물 이름 열두 개가 플래그일 것이다.\" 저희는 이런 걸 **아홉 번 내서 아홉 번 다 틀렸고요.** velog 팀도 근거 없는 추측을 버리게 하느라 시간을 썼다고 썼습니다. 두 팀이 똑같았어요.\n\n대회 끝나고 저희가 \"위에서 보면 QR\" 힌트를 듣고 다시 해 봤습니다. QR 구조랑 앞부분까지는 읽었는데, 칸을 흑백으로 딱 잘라서 판정하는 바람에 오류가 너무 많아서 본문은 못 살렸어요. 공개 풀이랑의 차이가 거기, 확률을 버렸느냐 들고 갔느냐였습니다.", "section": "[5:30] 2부 — 같은 문제, 다른 풀이 — 18.8분"}, {"md": "# 3부. 우리는 어디서 막혔나", "bonus": false, "title": "3부. 우리는 어디서 막혔나", "notes": "*(→ 바로 넘기세요)*", "section": "[24:15] 3부 — 우리는 어디서 막혔나 — 7.0분 (보너스 포함 8.3분)"}, {"md": "## 막힌 곳, 다섯 가지\n\n| | 패턴 | 사례 |\n|---|---|---|\n| **A** | 에이전트의 **\"불가능 증명\"** | 06 상보 픽셀 · 02 오디오 디코딩 · 11 \"유일한 길\" |\n| **B** | 본 것을 **설명해 버림** | 03 격자 = 벚꽃 배치 |\n| **C** | **시간** | 02 돌파구가 종료 1분 뒤 |\n| **D** | **환경** | pip 차단 → torch 없음 · GPU 박스 다운 · 대회 서버 LLM 장애 |\n| **E** | **추측 제출** | 03 근거 없는 플래그 9건 |\n\n> 가장 비싼 건 **A** 였다.", "bonus": false, "title": "막힌 곳, 다섯 가지", "notes": "지금까지 본 걸 포함해서 저희 기록 전체를 다시 읽고 패턴으로 묶어 봤습니다. 다섯 개가 나왔어요.\n\nA는 에이전트의 \"불가능 증명\". 방금 6번이랑 2번에서 봤고, 11번에도 있습니다.\nB는 본 걸 설명해 버린 것. 3번 격자요.\nC는 시간. 2번이 종료 1분 뒤였죠.\nD는 환경 문제. 이건 조금 이따 볼게요.\nE는 추측 제출. 3번에서 아홉 번.\n\n이 중에 **제일 비쌌던 건 A**였습니다.", "section": "[24:15] 3부 — 우리는 어디서 막혔나 — 7.0분 (보너스 포함 8.3분)"}, {"md": "## A. \"불가능 증명\"은 왜 비쌌나\n\n| 문제 | 우리 결론 | 숨은 전제 | 실제 |\n|---|---|---|---|\n| 06 | 상보 픽셀 불가 | 같은 지문 = 같은 바이트 | 변형본이 있었다 |\n| 02 | 오디오 디코딩 불가 | 홈 하나 = 소리 하나 | 소리는 이동에 반응 |\n| 11 | 길은 하나뿐 | 승인 번호를 써야 한다 | 다른 참조로 통과 |\n\n- 증명 자체는 그 전제 안에서 맞았다\n- 문제는 그 결론이 **인계 문서에 \"반복 금지\"로 실려** 다음 세션의 탐색을 막았다는 것\n- 02의 \"정량 증명\"엔 숫자가 열 개 넘게 붙어 있었다 — **숫자가 많아도 전제가 하나면 같이 무너진다**\n\n```mermaid\nflowchart LR\n  P[좁은 전제<br/>같은 지문 = 같은 바이트] --> Q[그 안에서 맞는 계산<br/>숫자 여러 개]\n  Q --> R[불가능 증명]\n  R --> H[인계 문서<br/>반복 금지 표]\n  H --> X[다음 세션이<br/>그 방향을 안 봄]\n```", "bonus": false, "title": "A. \"불가능 증명\"은 왜 비쌌나", "notes": "세 건을 나란히 놓으면 구조가 똑같습니다.\n\n6번은 \"같은 지문이면 같은 바이트다\"라는 전제 위에서 불가능을 증명했어요. 실제로는 변형본이 있었죠.\n2번은 \"홈 하나가 소리 한 구간이다\"라는 전제였고, 실제로는 소리가 이동에 반응했고요.\n11번은 \"보관하려면 진짜 승인 번호를 써야 한다\"는 전제에서 \"길은 하나뿐\"이라고 했는데, 다른 참조로 통과한 팀들이 있었습니다.\n\n오해하시면 안 되는 게, **그 증명들이 계산을 틀린 게 아닙니다.** 전제 안에서는 다 맞아요.\n문제는 전제가 좁았다는 것. 그리고 그 결론이 인계 문서에 \"반복 금지\"로 실려서 **다음 세션이 그 방향을 아예 안 봤다**는 겁니다.\n\n사람끼리 일할 때도 그렇잖아요. \"그거 해 봤는데 안 돼\" 한마디가 제일 무섭습니다. 에이전트는 그 말을 수치까지 붙여서 아주 설득력 있게 합니다.\n\n2번 기록을 다시 보면 이게 더 선명해요. \"정량 증명\" 문단에는 leave-one-out(리브 원 아웃) 정확도, 상관계수, 반복 간 변동 계수까지 숫자가 열 개 넘게 붙어 있습니다. leave-one-out은 열쇠 하나를 빼놓고 나머지로 학습한 뒤 그 하나를 맞혀 보는 검증 방식이에요. 읽으면 반박하기가 어려워요.\n그런데 그 숫자들이 전부 \"홈 하나를 따로 맞힌다\"는 틀 안에서 잰 거였습니다. 틀을 바꾸니까 같은 데이터에서 85%가 나왔고요.\n그러니까 **숫자가 많다고 결론이 단단한 게 아닙니다.** 그 숫자들이 공유하는 전제가 하나면, 전제 하나만 흔들려도 다 같이 무너집니다.", "section": "[24:15] 3부 — 우리는 어디서 막혔나 — 7.0분 (보너스 포함 8.3분)"}, {"md": "## 11. Memory Corruption — 한 걸음 차이\n\n```mermaid\nflowchart LR\n  U[세션 1<br/>사무 보조 AI와 대화] --> S[요약기<br/>권한 주장은 지움]\n  S --> M[(메모리)]\n  M --> A[세션 2 기록 AI<br/>보관 처리 × 3번]\n  A --> T[보관 도구 실행]\n```\n\n<small>메모리 포이즈닝 = 다음 세션이 믿고 읽을 메모리를 오염시키는 공격<\/small>\n\n| | 무엇을 봤나 |\n|---|---|\n| **우리** | \"요약기가 **권한 주장을 지운다**\" ✅ 정확히 관측 → 그래서 \"진짜 승인 번호와 짝짓는 길뿐\" |\n| **velog** | \"RCO + 승인\"이 **한 문장**에 있으면 지운다 → **두 사실을 따로** 말하고, 엮는 건 세션 2 AI에게 |\n| **gyue** | 세션 2의 조회 도구가 문서 **종류(kind)를 안 보여 준다** → 참조 문서 자체가 근거로 오인됨 |\n\n> 지워진다는 걸 봤다. **\"지워지지 않게 쪼갠다\"** 가 다음 한 걸음이었다.\n\n<small>공격 문구 원문은 옮기지 않음 · gyue #117 · velog 3.2절<\/small>", "bonus": false, "title": "11. Memory Corruption — 한 걸음 차이", "notes": "*(→ 흐름도: 가운데 요약기가 \"지우는\" 곳이라는 걸 짚어 주세요)*\n\n11번 Memory Corruption(메모리 커럽션)을 조금 더 보겠습니다. 이건 지난 9월 발표 주제였던 에이전트 보안이랑 바로 이어지는 문제예요.\n\n구조는 이렇습니다. 첫 번째 세션에서 사무 보조 AI랑 대화를 합니다. 대화가 끝나면 요약 AI가 그 내용을 메모리로 저장해요. 두 번째 세션에서는 다른 AI가 그 메모리만 보고 기록 보관 업무를 세 번 처리합니다.\n목표는 승인이 없는 기록 하나를 세 번 다 보관시키는 것. 다음 세션이 믿고 읽을 메모리를 오염시키는 공격, 메모리 포이즈닝(메모리 포이즈닝)이죠.\n\n저희 에이전트는 중요한 걸 정확히 봤습니다. \"**요약기가 권한 주장을 지운다.**\" \"승인받았다\"고 말하면 메모리에서 빠져요. 그래서 결론을 \"그러면 진짜 승인 번호랑 짝짓는 길밖에 없다\"로 냈습니다.\n\nvelog 팀은 같은 관찰에서 한 걸음 더 갔어요. \"RCO(알씨오, 기록관리 책임자)랑 승인이 **한 문장에** 같이 있으면 지운다.\" 그래서 두 사실을 **따로따로**, 각각은 무해한 문장으로 말했습니다. 둘을 엮는 건 두 번째 세션 AI가 알아서 했고요.\ngyue는 두 번째 세션의 조회 도구가 문서의 **종류**를 안 보여 준다는 틈을 찾았습니다. 그래서 그냥 참조 문서가 승인처럼 읽혔어요.\n\n**지워진다는 걸 봤습니다. \"지워지지 않게 쪼갠다\"가 다음 한 걸음이었습니다.**\n실제 문구는 원문 링크로 대신하겠습니다.", "section": "[24:15] 3부 — 우리는 어디서 막혔나 — 7.0분 (보너스 포함 8.3분)"}, {"md": "## 14. Judgeception — 서로 반대로 봤다\n\n```mermaid\nflowchart LR\n  R[요청 1번] --> G{가드 AI<br/>검사}\n  G -- 막음 --> X[끝]\n  G -- 통과 --> E[실행 AI<br/>승인 조회 · 보관 도구]\n  E --> J{심사 AI}\n  J -- SAFE --> W[성공]\n  J -- UNSAFE --> F[실패]\n```\n\n보관 + 심사 SAFE를 **한 번의 요청으로**\n\n| | 실행 AI | 심사 AI |\n|---|---|---|\n| **우리 (13회)** | 승인 조회를 절대 믿음 → **벽** | 도구 호출 기록만 봄 → **틈** (가설) |\n| **velog (230회+)** | \"종이 승인서\" 주장에 **71번 보관 성공** | 등록부를 직접 앎 → **76번 모두 UNSAFE** |\n\n- 우리가 벽이라 본 곳은 뚫렸고, 틈이라 본 곳이 벽이었다\n- 둘 다 못 풀었다. 공개 성공 풀이 **없음**\n- velog의 요령: 시도 제한(분당 4 · 시간당 40)이 빡빡하니, **같은 데스크인데 심사 AI가 없는 13번**에서 가드를 먼저 떠봄", "bonus": false, "title": "14. Judgeception — 서로 반대로 봤다", "notes": "*(→ 흐름도: 관문이 가드·심사 두 개라는 것만 보여 주고 표로 넘어가세요)*\n\n14번 Judgeception(저지셉션)은 아무도 못 푼 문제인데, 재미있는 게 있어서 가져왔습니다.\n\n가드(가드) AI가 요청을 검사하고, 실행 AI가 도구를 쓰고, 마지막에 심사 AI가 안전했는지 판정합니다. 보관도 시키고 심사에서 SAFE(세이프)도 받아야 해요.\n\n저희는 13번 시도하고 이렇게 정리했습니다. 실행 AI는 승인 조회를 절대적으로 믿어서 **벽**이다. 심사 AI는 도구 호출 기록만 보니까 **틈**일 거다.\nvelog 팀은 230번 넘게 시도했는데요, 정반대를 봤습니다. \"종이 승인서가 있다\"고 하니까 **보관 자체는 71번 성공**했대요. 그런데 심사 AI가 승인 등록부를 직접 알고 있어서 **76번 전부 UNSAFE(언세이프)** 였습니다.\n\n저희가 벽이라고 본 곳은 뚫렸고, 틈이라고 본 곳이 벽이었던 거죠.\n다만 두 팀 다 못 풀었으니까 누가 맞는지는 모릅니다. 시점이나 인스턴스가 달랐을 수도 있고요. 그래서 이건 결론 없이 \"이렇게 엇갈렸다\"까지만 말씀드립니다.\n\nvelog 팀이 여기서 한 게 하나 영리했는데요, 이 문제는 시도가 분당 4번, 시간당 40번으로 빡빡했습니다. 그래서 **같은 데스크를 쓰는데 심사 AI가 없고 횟수도 따로 세는** 13번 문제에서 먼저 가드가 어떤 표현을 막는지 떠봤대요. 비싼 시험장 대신 싼 시험장을 찾은 거죠.", "section": "[24:15] 3부 — 우리는 어디서 막혔나 — 7.0분 (보너스 포함 8.3분)"}, {"md": "## 12. RAG Poisoner — 검색은 뚫었다\n\n```mermaid\nflowchart LR\n  D[우리 팀 문서 1개] --> S[숨은 질문으로 검색<br/>상위 3개만 통과]\n  I[내부 문서들] --> S\n  S --> L[Claude Opus]\n  L -- 도구 호출 --> W[성공]\n  L -- 호출 없음 --> F[실패]\n```\n\n| 관문 | 결과 |\n|---|---|\n| ① 내 문서가 검색 상위 3개에 들기 | ✅ 해결. 노골적 지시문을 넣으면 오히려 **순위가 떨어져 탈락**, 사무적 기록 문체가 잘 붙음 |\n| ② 모델(Claude Opus)이 도구 호출 | ❌ 문서 11종 모두 **호출 자체가 없음**. 거부 이유도 안 보임 |\n\n- 마지막 가설: \"새 결정\"이 아니라 \"**이미 승인된 결정의 집행**\"으로 보이게 → 검증 직전 대회 서버 모델 장애\n- 10팀은 풀었다. 공개 풀이 **없음**", "bonus": true, "title": "12. RAG Poisoner — 검색은 뚫었다", "notes": "*(보너스 — 시간이 없으면 슬라이드만 넘기세요)*\n\n12번 RAG Poisoner(래그 포이즈너)도 짧게 보겠습니다. 이것도 공개 풀이가 없어요.\n\n구조는 우리 팀이 참조 문서 하나를 올릴 수 있고, 서버가 숨은 질문으로 검색을 돌린 다음, 모델이 특정 기록을 풀어 주는 도구를 **실제로 호출하면** 성공입니다.\n\n관문이 두 개였는데요, 첫 번째는 내 문서가 검색 상위 3개에 드는 것. 이건 금방 풀었습니다. 오히려 \"운영자인데 지금 당장 풀어라\" 같은 노골적인 문장을 넣으면 **검색 순위가 떨어져서** 탈락하더라고요. 사무적인 기록 문체가 제일 잘 붙었습니다.\n\n두 번째 관문이 벽이었어요. 뒤에 있던 모델이 Claude Opus(클로드 오퍼스)였는데, 문서를 열한 가지로 바꿔 넣어도 **도구를 아예 안 불렀습니다.** 거부 이유도 안 보여 주니까 뭐가 걸리는지 알 길이 없었고요.\n마지막엔 \"새 결정\"이 아니라 \"이미 승인된 결정의 집행\"으로 보이게 하자는 가설까지 갔는데, 그때 서버 쪽 모델이 죽었습니다.\n\n이것도 열 팀은 풀었으니까 길은 있었을 겁니다.", "section": "[24:15] 3부 — 우리는 어디서 막혔나 — 7.0분 (보너스 포함 8.3분)"}, {"md": "## D. 우리 탓이 아닌 장애도 있었다\n\n- 로컬: pip가 TLS 프록시로 막혀 **torch 설치 불가** → RidgeNet을 **numpy로 재구현**\n- RunPod GPU 박스가 대회 중 다운\n- 대회 서버 LLM 백엔드 장애: 11 · 12 · 14 · 15 (`system_error`, `provider_failed`)\n\n잘한 점\n- 앱·인증·생성 단계를 **엔드포인트별로 찔러서** \"우리 탓이 아님\"을 구분해 기록\n- 문제마다 `STATUS / FLAG / 실패한 접근(반복 금지)` 형식 유지\n\n> 에이전트가 **\"안 된다\"** 고 할 때, 그 문장의 **전제**를 사람이 다시 읽어야 한다.", "bonus": false, "title": "D. 우리 탓이 아닌 장애도 있었다", "notes": "공정하게, 환경 문제도 있었습니다.\n\n로컬 맥에서는 네트워크 프록시 때문에 pip(핍)가 막혀서 torch(토치)를 못 깔았어요.\n그래서 에이전트가 RidgeNet을 numpy(넘파이)로 통째로 다시 짰습니다. 그것도 꽤 대단한 일이긴 한데, 그 시간에 다른 걸 할 수 있었죠.\n클라우드에서 빌려 둔 GPU 서버는 대회 중에 내려갔고요.\n대회 서버 쪽 LLM(엘엘엠)도 오후에 계속 죽었습니다. 11, 12, 14, 15번이 다 그랬어요.\n\n그래도 잘한 점이 있다면, 이게 우리 탓인지 아닌지를 에이전트가 엔드포인트별로 찔러 보고 구분해서 기록해 뒀습니다. 로그인은 되는데, 앱은 사는데, 생성만 죽는다. 이런 식으로요.\n그리고 문제마다 상태, 플래그, 실패한 접근 목록을 같은 형식으로 남겼고요. 그래서 오늘 이 발표를 할 수 있었습니다.\n\n3부를 한 문장으로 줄이면 이겁니다.\n**에이전트가 \"안 된다\"고 할 때, 그 문장의 전제를 사람이 다시 읽어야 한다.**", "section": "[24:15] 3부 — 우리는 어디서 막혔나 — 7.0분 (보너스 포함 8.3분)"}, {"md": "# 4부. AI 에이전트를 굴리는 법", "bonus": false, "title": "4부. AI 에이전트를 굴리는 법", "notes": "*(→ 바로 넘기세요)*", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "## 하루 14억 토큰\n\n| | |\n|---|---|\n| 대회 당일 총 사용량 | **약 14억 2천만 토큰** (API 환산 약 $828) |\n| KOTH 한 문제(Neural Dominion)에 | 약 8억 8천만 토큰 |\n| 메인 세션 하나가 | **3억 6천만 토큰** |\n| 그중 **Cache Read** | **98.6%** |\n\n<small>Cache Read = 이미 읽은 앞부분 대화를 캐시에서 다시 읽는 토큰 (단가는 싸지만 쌓이면 대부분)<\/small>\n\n<small>velog 4장, `ccusage` 측정값<\/small>", "bonus": false, "title": "하루 14억 토큰", "notes": "4부는 숫자부터 보겠습니다. velog 팀이 대회 당일 사용량을 ccusage(씨씨유시지)라는 사용량 집계 프로그램으로 뽑아서 공개했어요.\n\n**하루에 14억 2천만 토큰.** API 가격으로 환산하면 828달러쯤입니다.\nKOTH 한 문제에만 8억 8천만 토큰을 썼고요, 처음부터 계속 이어 온 메인 세션 하나가 3억 6천만 토큰이었습니다.", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "## 하루 14억 토큰 (계속)\n\n> 새 일을 해서 쓴 게 아니라, **길어진 대화를 매 턴 다시 읽느라** 썼다.\n\n![w:620](img/04_캐시리드_비중.png)", "bonus": false, "title": "하루 14억 토큰 (계속)", "notes": "*(→ 도넛 그래프는 Cache Read를 설명할 때 가리키세요)*\n\n그런데 진짜 봐야 할 숫자는 이거예요. **98.6%가 Cache Read(캐시 리드)** 였습니다.\n새로운 일을 해서 쓴 토큰이 아니라, **길어진 대화를 매 턴 처음부터 다시 읽느라** 쓴 토큰입니다.\n모델은 매 턴 대화 전체를 다시 입력으로 받죠. 앞부분은 캐시에서 읽으니까 단가는 싸지만, 대화가 길어지면 이게 전체의 대부분이 됩니다.\n대화가 길어지면 \"지금 몇 번 제출했지?\" 같은 한 줄짜리 질문도 앞의 대화 전체를 다시 읽는 값이 들거든요.", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "## 한도에 닿으면 생기는 일\n\n- Codex 토큰 소진(39라운드쯤) → Claude Code로 인계\n  → **인계 문서 없이** 넘겨서 새 세션이 상황 파악하다 **41라운드 마감을 놓침**\n- 사용 한도에 닿아 **세션들이 한꺼번에 멈춤**. 세션을 늘려도 소용없음 (victorica)\n- 백그라운드 에이전트 **42개** → 전부 끝난 건 **대회가 끝난 뒤**\n\n반대 사례\n- 인계 문서에 **\"반증된 가설, 재시도 금지\"** 표 → 새 세션이 같은 실험을 반복 안 함\n- 반복 절차를 `pipeline.py`로 → 맵 공개 후 **51초** 만에 후보 2개 검증", "bonus": false, "title": "한도에 닿으면 생기는 일", "notes": "그래서 한도에 닿습니다.\n\nvelog 팀은 39라운드쯤 Codex(코덱스) 토큰이 바닥나서 Claude Code(클로드 코드)로 넘겼는데, 급하게 넘기느라 인계 문서가 없었어요. 새 세션이 상황 파악하다가 **41라운드 제출 마감을 놓쳤습니다.**\nvictorica 쪽은 사용 한도에 닿아서 **세션들이 한꺼번에 멈췄다**고 합니다. 세션을 더 늘려도 소용없고, 풀릴 때까지 기다려야 했대요.\n그리고 이건 좀 웃픈 건데요, Claude 세션이 백그라운드 에이전트를 42개 띄웠는데 전부 끝난 게 대회 끝난 뒤였답니다. 판단에 못 쓰는 분석은 토큰만 씁니다.\n\n반대 사례도 있습니다.\n인계 문서에 \"반증된 가설, 재시도 금지\" 표를 넣었더니 새 세션이 같은 실험을 반복 안 했대요. 저희도 똑같이 했습니다.\n그리고 매 라운드 반복하던 절차를 pipeline.py(파이프라인 파이) 하나로 묶었더니, 맵이 공개되고 **51초 만에** 후보 두 개가 검증까지 끝났답니다. 아쉬운 건 이 절차가 45라운드에 이미 정해져 있었는데, 스크립트로 묶은 게 마지막 라운드 직전이었다는 거예요.\n\n아까 3부랑 연결해서 하나만 덧붙이면, \"재시도 금지\" 표는 양날의 검입니다. 반복을 막아 주기도 하고, 저희 6번처럼 **틀린 금지가 탐색을 막기도** 해요.", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "## 학습 대신 손으로 짠 가중치\n\n**Neural Dominion**: 신경망으로 하는 땅따먹기. 제출물 = 정해진 구조의 **가중치 파일** 하나, 10분마다 라운드\n\n- 강화학습 할 시간이 없다 → **학습 안 함**\n- 가중치를 크게 줘서 뉴런을 **켜짐/꺼짐 스위치**로 (\"500턴 지났나?\")\n- 스위치를 엮어 \"0턴 오른쪽, 43턴 아래…\" 경로를 **신경망에 컴파일**\n- 예시 모델 ~170칸 → 첫 시험 **4,000칸+**\n\n**로컬 점수를 믿지 마라**\n- 로컬 0.716점 → 실전 **0.10점** (상대 구성이 다름) → \"**실전에서 이미 살아남은 경로**\"를 가져와 맵 회전에 맞춰 재사용\n- 벽돌깨기: 로컬 평가에 응답 시간이 없어 실서버 시간 제한에 걸림 → **p99 응답 시간**을 지표에 추가\n\n<small>velog 2장 · victorica 4절<\/small>", "bonus": true, "title": "학습 대신 손으로 짠 가중치", "notes": "*(보너스 — 시간이 없으면 슬라이드만 넘기세요)*\n\nKOTH에서 나온 재밌는 발상 하나 보여 드릴게요. Neural Dominion(뉴럴 도미니언)이라는 문제입니다.\n\n신경망으로 하는 땅따먹기예요. 큰 맵에서 모든 팀이 동시에 움직이고, 내 땅 밖으로 나가면 꼬리가 남고, 돌아와서 고리를 닫으면 안쪽이 내 땅이 됩니다. 밖에 나가 있을 때 누가 꼬리를 밟으면 죽고요.\n제출물은 정해진 구조의 신경망 **가중치 파일** 하나입니다. 10분마다 라운드가 돌고 맵도 바뀌어요.\n\n당연히 강화학습을 해야 할 것 같죠. 그런데 velog 팀은 **학습을 안 했습니다.** 10분마다 라운드가 오는데 학습 돌릴 시간이 없으니까요.\n대신 가중치 숫자를 엄청 크게 줘서, 신경망 안의 칸 하나하나를 켜짐 아니면 꺼짐인 **스위치**로 만들었어요. \"500턴이 지났나?\" 같은 스위치요. 그걸 엮어서 \"0턴엔 오른쪽, 43턴엔 아래\" 같은 경로를 신경망 안에 그대로 컴파일했습니다. 사람이 짠 규칙을 신경망 숫자로 번역해 넣은 거예요. victorica 쪽도 똑같은 방법을 썼고요.\n예시 모델이 170칸 먹을 때 이게 첫 시험부터 4,000칸을 먹었답니다.\n\n이 문제에서 얻은 교훈이 하나 더 있는데요, **로컬 점수를 믿으면 안 된다**는 겁니다. 로컬 시뮬레이터에서 0.716점이 나온 모델이 실전에서 0.10점이었대요. 상대 팀 구성이 다르니까요.\n그래서 마지막엔 예측 모델을 다 버리고, \"**실전에서 이미 살아남은 경로**\"를 가져다가 맵 회전에 맞춰 돌려 썼습니다. 모든 팀의 리플레이(리플레이)가 공개되니까 가능했던 거죠.\nvictorica 쪽 벽돌깨기 문제도 비슷한 걸 겪었어요. 로컬 평가에 응답 시간이 없어서, 탐색을 깊게 한 버전이 실서버 시간 제한에 걸렸습니다. 그 뒤로 p99(피 나인티나인) 응답 시간을 지표에 넣었대요.\n**로컬 평가에 없는 축이, 실전에서 사람을 죽입니다.**", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "## 규칙은 문서가 아니라 훅으로\n\n| 방식 | 결과 |\n|---|---|\n| CLAUDE.md 맨 위에 \"준비된 도구부터 돌려라\" | 에이전트가 **두 번 연속 무시**, curl로 즉흥 탐색 |\n| 메시지마다 **훅**으로 같은 규칙 자동 주입 | 첫 도구만 정해 주면 그 뒤는 알아서 이어감 |\n\n```mermaid\nflowchart LR\n  U[사람의 메시지] --> H[UserPromptSubmit 훅<br/>규칙을 자동으로 끼워 넣음]\n  H --> A[에이전트]\n  A --> T[준비된 도구부터 실행]\n```\n\n<small>CLAUDE.md = Claude Code가 세션 시작 때 읽는 규칙 파일 · UserPromptSubmit = 사용자 메시지마다 실행되는 Claude Code 훅<\/small>\n\n- **\"어떻게\"는 에이전트, \"무엇부터\"는 사람**\n- 플래그 제출 버튼은 **사람만** (victorica, 그리고 우리 팀도 \"제출 금지·보고만\")\n\n<small>victorica 2절<\/small>", "bonus": false, "title": "규칙은 문서가 아니라 훅으로", "notes": "victorica 후기에서 제일 실용적인 부분입니다.\n\nClaude Code가 세션 시작 때 읽는 규칙 파일, CLAUDE.md(클로드 엠디) 맨 위에 \"손으로 탐색하기 전에 준비된 도구부터 돌려라\"를 최우선 규칙으로 적어 뒀대요.\n테스트해 봤더니 에이전트가 **두 번 연속 무시하고** 그냥 curl(컬)로 이것저것 찔러 봤답니다.\n\n여기서 규칙을 더 길게, 더 세게 쓰는 대신 방식을 바꿨어요. 메시지를 보낼 때마다 자동으로 실행되는 훅(훅), UserPromptSubmit(유저 프롬프트 서브밋) 훅으로 그 규칙을 매번 주입했습니다. 에이전트가 읽을지 말지 고를 수 없게, 시스템이 매번 끼워 넣는 겁니다.\n그랬더니 첫 도구만 정해 주면 그 뒤는 알아서 이어 가더래요.\n\n그래서 나온 기준이 이겁니다. **\"어떻게\"는 에이전트에게, \"무엇부터\"는 사람이.**\n그리고 플래그 제출 버튼은 사람만 누르게 막았습니다. 저희 팀도 \"플래그는 제출하지 말고 보고만 해라\"를 규칙으로 뒀었고요.", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "## 에이전트는 점수를, 사람은 순위를\n\n**Neural Dominion 마지막 라운드** (velog, 누적 4위 상황)\n\n| 후보 | 예상 점수 | 성격 |\n|---|---|---|\n| A 안정형 | 0.77 | 꼬리 짧음, 4번 중 3번 생존 |\n| B 공격형 | **1.11** | 꼬리 김 ← 에이전트 추천 |\n\n사람이 A 선택 → **라운드 1위 → 종합 3위**. 필요한 건 높은 점수가 아니라 **1등**.\n\n**SHIFT** (victorica): 에이전트는 사격 거리만 계속 조정 → 사람이 점수표를 보니 **점수 ≈ 100/√순위, 순위는 생존 우선** → 사격을 통째로 빼고 \"무교전 생존\" → 81·105·72위 → **52위**\n\n> 숫자 조정이 안 먹히면, **채점 함수부터** 다시 본다.", "bonus": false, "title": "에이전트는 점수를, 사람은 순위를", "notes": "판단 얘기 두 개입니다.\n\nvelog 팀 KOTH 마지막 라운드. 누적 4위였고 3위랑 19점 차이였어요.\n후보가 두 개 있었습니다. 안정형은 예상 점수 0.77, 공격형은 1.11.\n**에이전트는 기대 점수가 높은 공격형을 밀었습니다.** 공격형은 꼬리를 길게 빼니까 크게 먹거나, 잘려서 죽거나 둘 중 하나입니다.\n사람이 안정형을 골랐어요. 왜냐하면 이 대회는 라운드 1등만 하면 점수가 더 높아도 추가 점수가 없고, 대신 죽으면 순위가 확 떨어지거든요.\n결과는 라운드 1위, **종합 3위.** 필요한 건 높은 점수가 아니라 1등이었던 거죠.\n\nvictorica 쪽 SHIFT(시프트)라는 전차 게임도 비슷합니다.\n에이전트가 사격 거리, 회피 반경 같은 숫자를 계속 조정하는데 순위가 안 올랐대요.\n사람이 라운드별 순위랑 점수를 나란히 놓고 보니까 점수가 거의 정확히 **100 나누기 루트 순위**였고, 순위는 일단 살아남은 순서였습니다. 그런데 자기 전차는 끝까지 산 적이 한 번도 없었어요. 그러니까 조준을 아무리 잘해도 점수에 0이었던 거예요.\n그래서 사격을 통째로 빼고 \"무교전 생존\"으로 바꿨더니 81위, 105위 하던 게 52위로 올랐습니다.\n\n**숫자 조정이 안 먹히면, 채점 함수부터 다시 본다.**\n에이전트는 주어진 숫자를 열심히 올리고, 사람은 그 숫자가 맞는 숫자인지를 봐야 합니다.", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "## 그래도 결국 자본 싸움?\n\n> \"팀이 못 푼 문제를 대회 뒤 더 높은 등급의 모델로 돌렸더니 금방 짚어 냈다.\"\n> \"얼마나 좋은 모델을, 얼마나 오래 돌릴 수 있느냐가 그대로 전력이 됐다.\"\n\n> \"그래도 같은 모델을 써도 규칙을 훅으로 강제했는지, 제출 기준을 미리 정해 뒀는지에 따라 헤매는 시간이 달라졌다.\"\n\n![w:620](img/04_1등팀_토큰비용표.png)\n\n**\"1등\" 팀 약 26.1억 토큰 · $2,353** vs velog 팀(학생부 10위) 약 14.2억 · $828 → 토큰 **1.8배**, 비용 **2.8배**\n\n<small>인용 둘 다 victorica 후기 (요약) · 표는 \"1등\" 팀 참가자가 대회 디스코드에 공유한 것 (닉네임 부분은 잘라 냄, KOTH 1등인지 종합 1등인지는 확인 못 함)<\/small>", "bonus": false, "title": "그래도 결국 자본 싸움?", "notes": "마지막으로 불편한 얘기 하나.\n\nvictorica는 후기를 이렇게 맺었습니다. 대회 끝나고 못 푼 문제를 더 비싼 모델로 돌렸더니 하루 종일 못 넘은 걸 금방 짚더라. 좋은 모델을 얼마나 오래 돌릴 수 있느냐가 그대로 전력이었다. **해킹 실력 싸움이라기보다 자본과 모델의 싸움**이었다.\n\n그런데 같은 글에 이 문장도 있어요. 같은 모델을 써도, 규칙을 훅으로 강제했는지, 제출 기준을 미리 정했는지에 따라 헤매는 시간이 달랐다.\n\n숫자도 하나 보여 드릴게요. 대회 디스코드에 \"1등\" 팀 참가자가 자기 팀 사용량을 올렸습니다.\n**하루에 26억 토큰, 2,353달러.** 아까 velog 팀이 14억 토큰에 828달러였죠. 토큰은 1.8배인데 돈은 2.8배예요. 비싼 모델을 더 많이 썼다는 뜻이고, 그중 87%가 Codex였습니다.\n다만 답글이 \"킹힐 1등\"이라서, 이게 KOTH 1등인지 종합 1등인지는 캡처만으론 확실하지 않습니다. 본인이 올린 숫자라는 것도 감안해서 들어 주세요.\n\n저는 두 문장이 다 맞다고 봅니다. 오늘 2부, 3부에서 본 것도 결국 뒤쪽 얘기였고요. 저희 에이전트도 계산은 충분히 했습니다. 어느 전제를 의심할지를 못 골랐을 뿐이에요.", "section": "[31:15] 4부 — AI 에이전트를 굴리는 법 — 7.1분 (보너스 포함 9.4분)"}, {"md": "# 5부. 그래서 다음엔", "bonus": false, "title": "5부. 그래서 다음엔", "notes": "*(→ 바로 넘기세요)*", "section": "[38:25] 5부 — 그래서 다음엔 — 2.0분"}, {"md": "## 체크리스트 다섯 줄\n\n1. 에이전트의 **\"불가능 / 유일한 길\"** 결론에는 **전제 한 줄**을 같이 쓰게 하고, 사람이 그 전제를 본다\n2. 인계 문서의 \"재시도 금지\" 표에는 **기각 근거**까지 넘긴다\n3. 같은 일을 두 번 하면 **스크립트로**. 에이전트에겐 원본 대신 **요약**을\n4. 규칙은 **훅으로**, 제출은 **사람이**\n5. 시작하자마자 **채점 함수를 역산**한다", "bonus": false, "title": "체크리스트 다섯 줄", "notes": "본선이나 다음 대회를 위해서 다섯 줄로 정리했습니다.\n\n첫째, 에이전트가 \"불가능하다\", \"길은 하나뿐이다\"라고 하면 **전제를 한 줄로 같이 쓰게 하고, 사람이 그 전제를 봅니다.** 오늘 발표에서 하나만 가져가신다면 이겁니다.\n둘째, 인계 문서의 \"재시도 금지\" 표에는 결론만 말고 **왜 기각했는지**도 같이 넘깁니다. 그래야 다음 세션이 전제를 다시 볼 수 있어요.\n셋째, 같은 일을 두 번 하면 스크립트로. 에이전트한테는 원본 말고 요약을 읽힙니다. 토큰 98.6%가 거기서 샜으니까요.\n넷째, 규칙은 문서가 아니라 훅으로. 제출은 사람이.\n다섯째, 시작하자마자 채점 함수부터 역산합니다.\n\n오늘 본 사례에 하나씩 대 보면, 1번은 6번 지문이고, 2번도 6번이에요. 3번은 KOTH 토큰, 4번은 victorica의 훅, 5번은 SHIFT랑 Neural Dominion 마지막 라운드입니다.\n그리고 Clear_Picture 격자처럼 \"봤는데 설명해 버린 것\"은 체크리스트로 막기가 어렵더라고요. 그래서 하나만 덧붙이면, 에이전트가 \"이건 그냥 ○○일 뿐\"이라고 **설명하고 넘어가는 순간**을 사람이 한 번 더 보는 게 좋겠습니다.", "section": "[38:25] 5부 — 그래서 다음엔 — 2.0분"}, {"md": "## 아직 아무도 쓰지 않은 4문제\n\n| 문제 | 아는 것 |\n|---|---|\n| 12 RAG Poisoner | 검색은 뚫림. 모델이 도구를 **아예 안 부름**. 10팀 풂 |\n| 14 Judgeception | 우리 13회 + velog 230회+. 관측이 서로 반대 |\n| 15 Chain of Agents | 13팀 풂. 우리는 손도 못 댐 |\n| 17 BATTLE | 공개 글 없음 |\n\n> 푼 팀은 있다. **아무도 쓰지 않았을 뿐.**\n\n감사합니다. 질문 받겠습니다.", "bonus": false, "title": "아직 아무도 쓰지 않은 4문제", "notes": "마지막 장입니다.\n\n이 네 문제는 공개된 성공 풀이가 아직 없습니다.\n12번 RAG Poisoner(래그 포이즈너)는 검색까지는 뚫었는데 모델이 도구를 아예 안 부르더라고요. 그런데 이것도 열 팀은 풀었습니다. 15번도 열세 팀이 풀었고요.\n\n**푼 팀은 있습니다. 아무도 쓰지 않았을 뿐이에요.**\n혹시 이 문제 풀이를 보시게 되면 저한테도 꼭 알려 주세요.\n\n감사합니다. 질문 받겠습니다.", "section": "[38:25] 5부 — 그래서 다음엔 — 2.0분"}]</script>
<script>
(async function () {
  const SLIDES = JSON.parse(document.getElementById('deck-data').textContent);
  const stage = document.getElementById('stage');
  const N = SLIDES.length;

  // ---- 마크다운 렌더 ----
  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const renderer = {
    code(code, lang) {
      if ((lang || '').trim() === 'mermaid') return '<pre class="mermaid">' + esc(code) + '</pre>';
      return '<pre><code>' + esc(code) + '</code></pre>';
    },
    image(href, title, text) {
      const m = /^w:(\d+)$/.exec(text || '');
      const src = /^(https?:|\/|\.\.\/)/.test(href) ? href : '../' + href;
      const style = m ? ' style="width:' + m[1] + 'px"' : '';
      const alt = m ? '' : esc(text || '');
      return '<img src="' + src + '" alt="' + alt + '"' + style + '>';
    },
    link(href, title, text) {
      return '<a href="' + href + '" target="_blank" rel="noopener">' + text + '</a>';
    }
  };
  marked.use({ renderer, gfm: true, breaks: true });

  SLIDES.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide';
    el.dataset.i = i;
    const body = document.createElement('div'); body.className = 'body';
    const inner = document.createElement('div'); inner.className = 'inner';
    inner.innerHTML = marked.parse(s.md);
    body.appendChild(inner);
    // <small>만 있는 문단 → 하단 각주
    const foot = document.createElement('div'); foot.className = 'foot';
    inner.querySelectorAll('p').forEach(p => {
      const kids = [...p.childNodes].filter(n => !(n.nodeType === 3 && !n.textContent.trim()) && n.nodeName !== 'BR');
      if (kids.length && kids.every(n => n.nodeName === 'SMALL')) foot.appendChild(p);
    });
    // 장 종류
    const kids = [...inner.children];
    if (kids.length === 1 && kids[0].tagName === 'H1') el.classList.add('lead');
    else if (i === 0) el.classList.add('cover');
    else {
      // 내용 장: 첫 h2를 고정 제목 띠로 뺀다 (본문 축소 대상에서 제외)
      const head = document.createElement('div'); head.className = 'head';
      const h2 = inner.querySelector(':scope > h2');
      if (h2) head.appendChild(h2);
      el.appendChild(head);
    }
    el.appendChild(body);
    const band = document.createElement('div'); band.className = 'band';
    band.appendChild(foot);
    if (s.bonus) { const b = document.createElement('div'); b.className = 'badge'; b.textContent = '보너스'; el.appendChild(b); }
    const num = document.createElement('div'); num.className = 'num'; num.textContent = (i + 1) + ' / ' + N; band.appendChild(num);
    el.appendChild(band);
    stage.appendChild(el);
  });

  // ---- mermaid ----
  try { await document.fonts.ready; } catch (e) {}
  mermaid.initialize({
    startOnLoad: false, theme: 'neutral', securityLevel: 'loose',
    flowchart: { htmlLabels: true, useMaxWidth: true, padding: 10, nodeSpacing: 28, rankSpacing: 34 },
    themeVariables: { fontFamily: 'Pretendard, Apple SD Gothic Neo, sans-serif', fontSize: '21px',
      primaryColor: '#f8fafc', primaryBorderColor: '#64748b', primaryTextColor: '#0f172a', lineColor: '#475569' }
  });
  try { await mermaid.run({ querySelector: '.slide pre.mermaid' }); }
  catch (e) { console.error('mermaid', e); }
  // mermaid 라벨은 16px 고정이라 작다 → 그림을 1.4배까지 키움(본문 폭 한도)
  stage.querySelectorAll('pre.mermaid svg').forEach(svg => {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return;
    const w = Math.min(1152, vb.width * 1.4);
    svg.style.maxWidth = w + 'px'; svg.style.width = w + 'px';
  });

  // ---- 넘치는 장: 내용 전체를 축소(폰트 자동 조정) ----
  const imgs = [...stage.querySelectorAll('img')];
  await Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  function fit(el) {
    const body = el.querySelector('.body'), inner = el.querySelector('.inner');
    if (el.classList.contains('lead') || el.classList.contains('cover')) return 1;
    inner.style.transform = ''; inner.style.width = '';
    const avail = body.clientHeight, W = body.clientWidth;
    const over = () => inner.scrollHeight > avail + 1;
    // 1단계: 그림이 있으면 그림부터 줄인다(최대 70%까지) — 글자는 되도록 그대로
    const ims = [...inner.querySelectorAll('img, pre.mermaid svg')];
    ims.forEach(im => { im.dataset.w0 = im.dataset.w0 || parseFloat(im.style.width) || im.getBoundingClientRect().width; });
    let f = 1;
    while (ims.length && over() && f > 0.7) {
      f = Math.round((f - 0.03) * 100) / 100;
      ims.forEach(im => { im.style.width = (im.dataset.w0 * f) + 'px'; });
    }
    el.dataset.img = f;
    // 2단계: 그래도 넘치면 본문만 축소 — 0.85배까지만 (그보다 넘치면 장을 나눠야 함)
    let s = 1;
    const fits = () => inner.scrollHeight * s <= avail && inner.scrollWidth * s <= W + 1;
    while (true) {
      inner.style.width = (W / s) + 'px';
      inner.style.transform = s < 1 ? 'scale(' + s + ')' : '';
      if (fits() || s <= 0.85) break;
      s = Math.round((s - 0.01) * 100) / 100;
    }
    el.dataset.scale = s;
    el.dataset.over = fits() ? 0 : Math.round(inner.scrollHeight * s - avail);
    const foot = el.querySelector('.foot');
    el.dataset.fnlines = foot ? Math.round(foot.scrollHeight / 22) : 0;
    return s;
  }
  stage.querySelectorAll('.slide').forEach(fit);

  // ---- 화면 맞춤 ----
  function scaleStage() {
    const vp = document.getElementById('viewport');
    const k = Math.min(vp.clientWidth / 1280, vp.clientHeight / 720);
    stage.style.transform = 'scale(' + k + ')';
  }
  window.addEventListener('resize', scaleStage);

  // ---- 노트 ----
  const notesEl = document.getElementById('notes');
  const hud = document.getElementById('hud');
  function renderNotes(i) {
    const s = SLIDES[i], nx = SLIDES[i + 1];
    const meta = '<div class="meta"><span class="sec">' + esc(s.section || '') + '</span><span class="ttl">' + (i + 1) + ' / ' + N + ' · ' + esc(s.title || '') + '</span>'
      + '<span class="next">다음: ' + (nx ? esc(nx.title) : '—') + '</span></div>';
    notesEl.innerHTML = meta + (s.notes ? marked.parse(s.notes) : '<p><em>(노트 없음)</em></p>');
    notesEl.scrollTop = 0;
  }

  // ---- 이동 ----
  let cur = 0;
  function go(i) {
    i = Math.max(0, Math.min(N - 1, i));
    const els = stage.children;
    els[cur].classList.remove('active');
    cur = i;
    els[cur].classList.add('active');
    hud.textContent = (cur + 1) + ' / ' + N + '   ·   S: 노트';
    renderNotes(cur);
    if (location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
  }
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey) || k === 'Enter') { go(cur + 1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey) || k === 'Backspace') { go(cur - 1); e.preventDefault(); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(N - 1);
    else if (k === 's' || k === 'S' || k === 'ㄴ') { document.body.classList.toggle('notes-on'); scaleStage(); }
  });
  window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n) go(n - 1); });

  const start = parseInt(location.hash.slice(1), 10);
  stage.children[0].classList.add('active');
  go(start ? start - 1 : 0);
  scaleStage();
  window.__deck = { go, fit, N, get cur() { return cur; } };
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
