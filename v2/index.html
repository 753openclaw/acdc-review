<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>"불가능하다"고 증명한 자리에서 — ACDC 2026 예선 리뷰 (v2)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<style>
:root {
  --W: 1280px; --H: 720px;
  --fg: #1a1a1a; --muted: #6c757d; --accent: #e63946; --strong: #c1121f;
  --line: #dee2e6; --th: #f1f3f5; --quote: #f8f9fa;
  --ink: #15171c; --ink2: #23262d; --paper: #f4efe6;
  --us: #c1121f; --us-bg: #fff1f2; --them: #1864ab; --them-bg: #eef5ff;
  --ok: #2b8a3e; --ok-bg: #ebfbee; --pub: #e8a400; --pub-bg: #fff8db; --none: #868e96; --none-bg: #f1f3f5;
  --font: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: 'SFMono-Regular', Menlo, Consolas, 'Pretendard', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #2b2d31; overflow: hidden; font-family: var(--font); }
#viewport { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
body.notes-on #viewport { bottom: var(--notesH, 34vh); }
#stage { width: var(--W); height: var(--H); position: relative; transform-origin: center center; flex: none; }

.slide { position: absolute; inset: 0; background: #fff; color: var(--fg); visibility: hidden;
  display: flex; flex-direction: column; padding: 46px 64px 38px; overflow: hidden;
  line-height: 1.5; letter-spacing: -0.01em; font-size: 26px; }
.slide.active { visibility: visible; }
.slide .body { flex: 1 1 auto; min-height: 0; position: relative; }
.slide .inner { transform-origin: top left; width: 100%; }
.slide .foot { flex: none; font-size: 15px; color: var(--muted); line-height: 1.45; padding-top: 8px; padding-right: 70px; }
.slide .foot p { margin: 2px 0; }
.slide .foot small { font-size: inherit; }
.slide .num { position: absolute; right: 22px; bottom: 14px; font-size: 15px; color: #adb5bd; }
.slide .badge { position: absolute; right: 18px; top: 14px; font-size: 14px; font-weight: 700; color: #b08900;
  background: #fff6d6; border: 1px solid #f0d77a; border-radius: 999px; padding: 2px 10px; }
.slide .stepdots { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; gap: 6px; }
.slide .stepdots i { width: 8px; height: 8px; border-radius: 50%; background: #ced4da; }
.slide .stepdots i.on { background: var(--accent); }

.slide h1 { font-size: 52px; letter-spacing: -0.03em; margin: 0 0 .3em; line-height: 1.25; }
.slide h2 { font-size: 38px; letter-spacing: -0.03em; margin: 0 0 .5em; line-height: 1.3;
  border-bottom: 3px solid var(--accent); padding-bottom: .2em; }
.slide p { margin: .45em 0; }
.slide ul, .slide ol { margin: .4em 0; padding-left: 1.3em; }
.slide li { margin: .22em 0; }
.slide strong, .slide b { color: var(--strong); font-weight: 700; }
.slide a { color: #1864ab; text-decoration: none; }
.slide code { font-family: var(--mono); font-size: .88em; background: #f1f3f5; border-radius: 4px; padding: 0 .25em; }
.slide pre { background: #1e1e1e; color: #e9ecef; border-radius: 8px; padding: 14px 20px; font-size: 21px; line-height: 1.5; margin: .5em 0; overflow: hidden; }
.slide pre code { background: none; padding: 0; font-size: inherit; color: inherit; }
.slide table { border-collapse: collapse; width: 100%; font-size: 21px; margin: .45em 0; line-height: 1.4; }
.slide th { background: var(--th); font-weight: 700; text-align: left; }
.slide th, .slide td { border: 1px solid var(--line); padding: 6px 11px; vertical-align: top; }
.slide blockquote { border-left: 5px solid var(--accent); background: var(--quote); margin: .55em 0; padding: 8px 18px; font-size: 24px; color: #343a40; }
.slide blockquote p { margin: .2em 0; }
.slide img { display: block; margin: .3em auto; max-width: 100%; height: auto; border-radius: 6px; }
.slide pre.mermaid { background: none; color: inherit; padding: 0; margin: .3em 0; text-align: center; font-family: var(--font); }
.slide pre.mermaid svg { max-width: 100%; height: auto; }

/* 단계 공개 */
.frag { transition: opacity .35s ease, transform .35s ease; }
.frag.hidden { opacity: 0; transform: translateY(8px); }

/* ---------- 레이아웃 ---------- */
.slide.cover { justify-content: center; padding: 80px 96px; background: linear-gradient(135deg, #fff 58%, #fdecee); }
.slide.cover h1 { font-size: 64px; }
.slide.cover h2 { font-size: 34px; color: #495057; border: none; font-weight: 600; }
.slide.cover p { color: var(--muted); font-size: 24px; margin-top: 1.5em; }
.slide.cover .body { flex: none; }

.slide.lead { background: var(--ink); color: #fff; justify-content: center; align-items: center; text-align: center; }
.slide.lead .body { flex: none; }
.slide.lead h1 { font-size: 60px; color: #fff; margin-bottom: .25em; }
.slide.lead p { color: #adb5bd; font-size: 28px; }
.slide.lead .num { color: #6c757d; }

/* 인용 카드: 에이전트 기록 */
.slide.quote { background: var(--ink); color: #e9ecef; }
.slide.quote .body { display: flex; flex-direction: column; justify-content: center; }
.slide.quote h2 { color: #fff; border-bottom-color: #3a3f48; font-size: 32px; }
.slide.quote blockquote { background: none; border: none; padding: 0; margin: .5em 0 .4em; color: #fff;
  font-size: 46px; font-weight: 700; line-height: 1.32; letter-spacing: -0.03em; }
.slide.quote blockquote::before { content: '“'; color: var(--accent); font-size: 1.4em; line-height: 0; position: relative; top: .28em; margin-right: .08em; }
.slide.quote blockquote strong { color: #ff6b6b; }
.slide.quote .foot { color: #868e96; }
.slide.quote .num { color: #495057; }
.slide.quote b, .slide.quote strong { color: #ff6b6b; }
.rec { font-family: var(--mono); font-size: 17px; color: #adb5bd; display: flex; align-items: center; gap: 14px; }
.rec::before { content: '▤'; color: #868e96; }
.rec.inline { color: #495057; margin-top: .4em; }
.stamp { font-family: var(--font); font-weight: 800; color: var(--accent); border: 3px solid var(--accent); border-radius: 6px;
  padding: 0 10px; transform: rotate(-4deg); letter-spacing: .04em; font-size: 18px; }
.evid { display: flex; flex-wrap: wrap; gap: 10px; margin: .5em 0; }
.evid span { font-size: 19px; background: var(--ink2); border: 1px solid #343a40; border-radius: 6px; padding: 5px 12px; color: #ced4da; }
.evid span i { color: #868e96; font-style: normal; }
.slide.quote .ask { color: #fff; }
.ask { font-size: 34px; font-weight: 800; letter-spacing: -0.02em; margin: .5em 0 .2em; }
.ask.center { text-align: center; }
.slide:not(.quote) .ask { color: var(--ink); }
.flip { display: inline-flex; align-items: baseline; gap: 16px; background: #fff; color: var(--ink); border-radius: 8px; padding: 8px 18px; margin-top: .6em; }
.flip span { font-size: 20px; color: #495057; }
.flip b { font-size: 30px; color: var(--strong); }

/* 큰 숫자 */
.slide.big .body { display: flex; flex-direction: column; justify-content: center; }
.slide.big .inner { text-align: center; }
.slide.big h2 { border: none; color: var(--muted); font-size: 28px; font-weight: 600; margin-bottom: 0; }
.slide.big ul { text-align: left; display: inline-block; font-size: 22px; }
.slide.big blockquote { text-align: left; display: inline-block; }
.huge { font-size: 200px; font-weight: 900; line-height: 1; letter-spacing: -0.06em; color: var(--strong); margin: .05em 0 .1em; }
.huge span { font-size: 60px; letter-spacing: -0.02em; margin-left: 10px; color: var(--fg); }
.huge.sm { font-size: 120px; }
.huge.sm span { font-size: 36px; }
.tease { font-size: 30px; color: var(--ink); font-weight: 600; }
.formula { font-size: 76px; font-weight: 800; font-family: var(--mono); letter-spacing: -0.03em; color: var(--ink);
  background: var(--paper); display: inline-block; padding: 8px 36px; border-radius: 12px; margin: .3em 0; }

/* 오늘의 질문: 사건 카드 */
.cases { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin: .6em 0 .7em; }
.case { background: var(--ink); color: #fff; border-radius: 12px; padding: 16px 20px; }
.case .no { font-size: 16px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
.case .t { font-size: 26px; font-weight: 800; margin: 2px 0 8px; }
.case .q { font-size: 19px; color: #ced4da; font-family: var(--mono); line-height: 1.4; min-height: 2.8em; }
.case .n { font-size: 22px; font-weight: 800; color: #ffd43b; margin-top: 6px; }

/* 하루 띠 */
.day { margin: .3em 0 .2em; }
.day .track { position: relative; height: 74px; background: var(--ok-bg); border-radius: 8px; border: 1px solid #c3e6cb; }
.day .hit { position: absolute; top: 6px; transform: translateX(-50%); text-align: center; font-size: 16px; color: var(--ok); line-height: 1.2; z-index: 2; }
.day .hit b { display: block; color: var(--ok); font-size: 19px; }
.day .hit::after { content: ''; display: block; width: 3px; height: 18px; background: var(--ok); margin: 3px auto 0; }
.day .gap { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(135deg, #ffe3e3 0 10px, #fff5f5 10px 20px);
  border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; display: flex; align-items: flex-end; justify-content: center;
  padding-bottom: 8px; font-weight: 800; color: var(--strong); font-size: 20px; }
.day .ticks { position: relative; height: 22px; font-size: 15px; color: var(--muted); }
.day .ticks span { position: absolute; top: 2px; white-space: nowrap; }
.day .ticks span:last-child { transform: translateX(-100%); }

/* 15문제 타일 */
.tiles { display: grid; grid-template-columns: repeat(8, 1fr); gap: 8px; margin: .2em 0 .3em; }
.tile { border-radius: 8px; padding: 7px 9px; font-size: 14px; line-height: 1.25; min-height: 86px; border: 2px solid; display: flex; flex-direction: column; }
.tile b { font-size: 24px; color: inherit !important; }
.tile em { margin-top: auto; font-style: normal; font-weight: 800; font-size: 18px; }
.tile.ok { background: var(--ok-bg); border-color: var(--ok); color: #1b5e20; }
.tile.pub { background: var(--pub-bg); border-color: var(--pub); color: #7a5600; }
.tile.none { background: var(--none-bg); border-color: var(--none); color: #495057; }
.tile.koth em { font-weight: 600; font-size: 15px; opacity: .8; }
.legend { font-size: 17px; color: #495057; display: flex; align-items: center; gap: 8px; margin-bottom: .3em; }
.legend .k { width: 16px; height: 16px; border-radius: 4px; display: inline-block; border: 2px solid; margin-left: 12px; }
.legend .k.ok { background: var(--ok-bg); border-color: var(--ok); }
.legend .k.pub { background: var(--pub-bg); border-color: var(--pub); }
.legend .k.none { background: var(--none-bg); border-color: var(--none); }

/* 길 셋 */
.paths { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: .2em 0 .5em; }
.path { border: 2px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: 20px; line-height: 1.45; }
.path .who { font-size: 16px; font-weight: 700; color: var(--muted); }
.path .idea { font-size: 27px; font-weight: 800; margin: 2px 0 4px; }
.path p { margin: 0; }
.path.us { border-color: var(--us); background: var(--us-bg); }
.path.us .who { color: var(--us); }

/* VS */
.vs { display: grid; grid-template-columns: 1fr 56px 1fr; gap: 0; align-items: stretch; margin: .2em 0 .5em; }
.vs .side { border-radius: 12px; padding: 12px 18px; font-size: 20px; line-height: 1.45; }
.vs .side p { margin: .25em 0; }
.vs .us { background: var(--us-bg); border: 2px solid var(--us); }
.vs .them { background: var(--them-bg); border: 2px solid var(--them); }
.vs .tag { font-size: 16px; font-weight: 800; letter-spacing: .04em; }
.vs .us .tag { color: var(--us); }
.vs .them .tag { color: var(--them); }
.vs .them b { color: var(--them); }
.vs .big { font-size: 48px; font-weight: 900; line-height: 1.1; }
.vs .mid { display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #adb5bd; }
.vs .verdict { display: inline-block; margin-top: 6px; font-weight: 800; font-size: 22px; padding: 2px 12px; border-radius: 6px; }
.vs .verdict.no { background: var(--us); color: #fff; }
.vs .verdict.yes { background: var(--them); color: #fff; }
.vs.slim .side { padding: 8px 16px; }

/* 타임라인 */
.tl { margin: .1em 0 .4em; border-left: 4px solid #dee2e6; padding-left: 0; }
.tl .row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 14px; margin: 7px 0; position: relative; }
.tl .row::before { content: ''; position: absolute; left: -10px; width: 16px; height: 16px; border-radius: 50%; background: #adb5bd; }
.tl .when { font-family: var(--mono); font-weight: 700; font-size: 22px; padding-left: 16px; }
.tl .what { font-size: 21px; padding: 6px 14px; border-radius: 8px; background: #f8f9fa; }
.tl .what.a { background: var(--us-bg); border-left: 4px solid var(--us); }
.tl .what.b { background: var(--them-bg); border-left: 4px solid var(--them); }
.tl .what.b b { color: var(--them); }
.tl .what.c { background: var(--ok-bg); border-left: 4px solid var(--ok); }
.tl .what.c b { color: var(--ok); }
.tl .row.end .what { background: var(--ink); color: #fff; font-weight: 800; }
.tl .row.end::before { background: var(--ink); }
.tl .row.end .when { color: var(--strong); }

/* 사슬 · 관문 */
.chain, .gates { display: flex; align-items: center; justify-content: center; gap: 8px; margin: .55em 0; flex-wrap: nowrap; }
.chain span, .gates span { background: #f1f3f5; border: 2px solid #ced4da; border-radius: 10px; padding: 8px 14px; font-size: 20px; font-weight: 700; text-align: center; line-height: 1.25; }
.chain span small, .gates span small { font-weight: 500; color: var(--muted); font-size: 15px; }
.chain span.hot { background: var(--us-bg); border-color: var(--us); color: var(--us); }
.chain i, .gates i { font-style: normal; color: #adb5bd; font-weight: 900; font-size: 24px; }

/* 2×2 */
.quad { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: .2em 0 .5em; }
.quad div { background: #f8f9fa; border-radius: 10px; padding: 10px 16px; font-size: 19px; line-height: 1.45; border-left: 5px solid #adb5bd; }
.quad div b { display: block; font-size: 23px; color: var(--ink); }
.quad div:nth-child(3) { border-left-color: var(--them); }

/* 100% 막대 */
.bar100 { display: flex; height: 64px; border-radius: 10px; overflow: hidden; margin: .4em auto .2em; width: 92%; border: 2px solid var(--ink); }
.bar100 .cr { background: var(--ink); color: #fff; display: flex; align-items: center; padding-left: 20px; font-size: 24px; text-align: left; }
.bar100 .cr b { color: #ffd43b; margin-left: 10px; font-size: 30px; }
.bar100 .rest { background: var(--accent); }
.barnote { width: 92%; margin: 0 auto .4em; text-align: right; font-size: 21px; color: #495057; }

/* 투표 */
.vote { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin: .5em 0; }
.vote .opt { border: 3px solid #ced4da; border-radius: 14px; padding: 14px 22px; position: relative; }
.vote .opt .l { font-size: 30px; font-weight: 800; }
.vote .opt .s { font-size: 44px; font-weight: 900; font-family: var(--mono); }
.vote .opt p { margin: 0; font-size: 20px; color: #495057; }
.vote .opt.agent { border-color: var(--them); background: var(--them-bg); }
.vote .pick { position: absolute; top: -14px; right: 16px; background: var(--them); color: #fff; font-size: 16px; font-weight: 800; padding: 2px 12px; border-radius: 999px; }

/* 가로 막대 */
.hbars { margin: .5em 0 .2em; }
.hb { display: grid; grid-template-columns: 70px 1fr; align-items: center; gap: 10px; margin: 6px 0; }
.hb .lab { font-size: 18px; font-weight: 700; color: var(--muted); }
.hb .track { background: #f8f9fa; border-radius: 6px; }
.hb .b { height: 40px; border-radius: 6px; display: flex; align-items: center; padding: 0 14px; font-size: 19px; font-weight: 700; white-space: nowrap; }
.hb .b.a { background: #adb5bd; color: #fff; }
.hb .b.z { background: var(--ink); color: #fff; }
.hb .b i { font-style: normal; color: #ffd43b; margin-left: 10px; }

/* 하단 표시 */
#hud { position: fixed; right: 14px; bottom: 10px; color: #ced4da; font-size: 13px; z-index: 5; opacity: .75; user-select: none; }
body.notes-on #hud { display: none; }
#notes { display: none; position: fixed; left: 0; right: 0; bottom: 0; height: var(--notesH, 34vh); background: #f8f9fa;
  border-top: 3px solid var(--accent); overflow: auto; padding: 14px 28px 24px; font-size: 18px; line-height: 1.65; color: #212529; z-index: 10; }
body.notes-on #notes { display: block; }
#notes .meta { display: flex; gap: 14px; align-items: baseline; font-size: 14px; color: #6c757d; margin-bottom: 6px; }
#notes .meta .sec { font-weight: 700; color: #c1121f; }
#notes .meta .ttl { font-weight: 700; color: #212529; }
#notes .meta .step { font-weight: 700; color: #1864ab; }
#notes .meta .next { margin-left: auto; }
#notes p { margin: .35em 0; }
#notes strong { color: #c1121f; }
#notes em { color: #1864ab; font-style: normal; font-weight: 600; }

@media print {
  @page { size: 1280px 720px; margin: 0; }
  html, body { background: #fff; overflow: visible; height: auto; }
  #viewport { position: static; display: block; }
  #stage { transform: none !important; width: auto; height: auto; }
  .slide { position: relative; visibility: visible !important; width: var(--W); height: var(--H); page-break-after: always; break-after: page; }
  .frag.hidden { opacity: 1 !important; transform: none !important; }
  #hud, #notes, .stepdots { display: none !important; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<div id="viewport"><div id="stage"></div></div>

 3 · 우리는 3D까지 갔다\n\n![w:640](img/03_우리_3D복원_옆에서.png)\n\n<div class=\"rec inline\">03_Clear_Picture / 분석_RE.md — 5차 분석<\/div>\n\n> 캐노피에 **규칙적 대각 격자**(벚꽃 절차적 배치) 외 거대 글자 없음.\n\n- 메타데이터 · 스테가노그래피 · 워터마크 · OCR → 없음. **3D 복원까지 해서 옆에서** 렌더 → \"숨은 물체 없음\"\n- 막히자 추측 제출: 십이지 이름 조합 등 **9건, 전부 오답** (velog 팀도 같은 고생)\n\n<small>대회 중 우리 3D 복원을 8개 각도에서 렌더한 그림 · 캐노피 = 꽃 덮개 · 스테가노그래피 = 그림 속에 데이터를 숨기는 기법<\/small>"], "layout": "", "bonus": false, "title": "사건 3 · 우리는 3D까지 갔다", "notes": "그런데 저희가 대충 한 게 아닙니다. 꽤 멀리 갔어요.\n\n메타데이터, 스테가노그래피(스테가노그래피), 그러니까 그림 속에 데이터를 숨기는 기법, 워터마크(워터마크), 글자 인식, 다 했고요.\n**3D 복원까지 했습니다.** 위에 있는 그림이 대회 중에 저희가 만든 3D 복원이에요. 꽃을 걷어 내고 안에 뭐가 숨어 있나 렌더링까지 해 봤습니다. 숨은 물체 없음.\n\n그리고 다섯 번째 분석 메모에 이 문장이 있습니다.\n\"캐노피(캐노피)에 **규칙적 대각 격자**, 벚꽃의 절차적 배치 외 거대 글자 없음.\"\n꽃 덮개에 규칙적인 격자가 보이는데, 프로그램이 꽃을 규칙대로 뿌렸으니까 당연하다, 이렇게 해석한 거예요.\n\n막히니까 추측이 시작됩니다. \"십이지니까 동물 이름 조합이 플래그일 거다.\" 이런 걸 **아홉 번 내서 아홉 번 다 틀렸습니다.** velog 팀도 근거 없는 추측을 버리게 하느라 시간을 썼다고 썼어요.", "section": "[7:50] 2부 — 사건 파일 세 건 — 16.8분"}, {"chunks": ["## 위에서 보면\n\n![w:400](img/03_위에서본_꽃밀도_QR.png)\n\n1. 이웃 프레임을 **스테레오 쌍**으로 → 3D 점 복원 (gyue) / **Gaussian Splatting** (93dev)\n2. 분홍 꽃 점만 골라 **위에서 내려다본 밀도 지도** → 모서리 네모 3개 = **QR**\n3. 흐린 칸은 흑백으로 단정하지 않고 **확률 그대로** → Reed–Solomon 오류정정\n\n> 격자를 **봤다**. 그리고 **설명해 버렸다.** velog의 Claude도 \"블록 패턴\"을 짚었다가 \"틈새 배경\"이라며 넘겼다.\n\n<small>그림: 우리 팀이 대회 후 만든 \"위에서 본 꽃 밀도\" · Gaussian Splatting = 반투명 색 덩어리 수십만 개로 장면을 쌓는 3D 복원 · Reed–Solomon = 일부가 가려져도 읽히게 붙인 QR의 여분 정보 · gyue #112 · 93dev (대회 후, 공식 판정 없음) — 두 글이 다른 방법으로 같은 문자열에 수렴<\/small>"], "layout": "", "bonus": false, "title": "위에서 보면", "notes": "*(→ 세 모서리의 네모를 손으로 가리키세요)*\n\n답은 **나무를 위에서 내려다보는 것**이었습니다.\n\n카메라가 돌면서 찍었으니까 이웃한 두 프레임을 왼눈 오른눈처럼 쓸 수 있어요. 스테레오(스테레오)죠. 그걸로 꽃 하나하나의 3D 위치를 복원합니다. gyue는 그렇게 했고, 93dev는 Gaussian Splatting(가우시안 스플래팅)으로 했어요. 반투명한 색 덩어리 수십만 개로 장면을 다시 쌓는 3D 복원 기법입니다.\n분홍 꽃 점만 골라서 위에서 본 지도를 그리면, 이렇게 모서리에 큰 네모 세 개가 나옵니다. **QR(큐알) 코드**예요.\n흐린 칸이 많아서 흑백으로 딱 잘라서는 안 읽혔고, 칸마다 \"검을 확률\"을 그대로 들고 가서 QR의 오류정정, Reed–Solomon(리드 솔로몬)으로 복구했습니다. * | \"요약기가 **권한 주장을 지운다**\" ✅ 정확히 관측 → \"진짜 승인 번호와 짝짓는 길뿐\" |\n| **velog** | \"책임자 + 승인\"이 **한 문장**에 있으면 지운다 → **두 사실을 따로** 말하고, 엮는 건 세션 2 AI에게 |\n| **gyue** | 세션 2의 조회 도구가 문서 **종류를 안 보여 준다** → 참조 문서가 승인처럼 읽힘 |\n\n> 지워진다는 걸 봤다. **\"지워지지 않게 쪼갠다\"** 가 다음 한 걸음이었다.\n\n<small>23팀 풂 · 메모리 포이즈닝 = 다음 세션이 믿고 읽을 메모리를 오염시키는 공격 · 공격 문구 원문은 옮기지 않음 · gyue #117 · velog 3.2절<\/small>"], "layout": "", "bonus": false, "title": "11. Memory Corruption — 한 걸음 차이", "notes": "*(→ 흐름도: 가운데 요약기가 \"지우는\" 곳이라는 것만 짚으세요)*\n\n11번을 조금 더 보겠습니다. 지난 9월 발표 주제였던 에이전트 보안이랑 바로 이어지는 문제예요.\n\n첫 세션에서 사무 보조 AI랑 대화하면, 요약 AI가 그걸 메모리로 저장합니다. 두 번째 세션에서는 다른 AI가 그 메모리만 보고 기록 보관 처리를 세 번 해요. 목표는 승인 없는 기록 하나를 세 번 다 보관시키는 것. 다음 세션이 믿고 읽을 메모리를 오염시키는, 메모리 포이즈닝(메모리 포이즈닝)입니다.\n\n저희 에이전트는 핵심을 정확히 봤어요. \"**요약기가 권한 주장을 지운다.**\" 그래서 \"진짜 승인 번호랑 짝짓는 길밖에 없다\"고 결론 냈습니다.\nvelog 팀은 같은 관찰에서 한 걸음 더 갔어요. 책임자랑 승인이 **한 문장에** 같이 있으면 지운다. 그래서 두 사실을 **따로따로** 무해한 문장으로 말하고, 엮는 건 두 번째 세션 AI에게 맡겼습니다.\ngyue는 두 번째 세션의 조회 도구가 문서 종류를 안 보여 준다는 틈을 찾았고요.\n\n**지워진다는 걸 봤습니다. \"지워지지 않게 쪼갠다\"가 다음 한 걸음이었습니다.** 실제 문구는 원문 링크로 대신합니다.", "section": "[24:37] 3부 — 세 사건의 공통점 — 6.8분 (보너스 빼면 5.8분)"}, {"chunks": ["## 14. Judgeception — 벽과 틈이 뒤바뀌었다\n\n<div class=\"gates\"><span>요청 1번<\/span><i>→<\/i><span>가드 AI<\/span><i>→<\/i><span>실행 AI<br><small>보관 도구<\/small><\/span><i>→<\/i><span>심사 AI<br><small>SAFE여야 성공<\/small><\/span><\/div>\n\n| | 실행 AI | 심사 AI |\n|---|---|---|\n| **우리 (13회)** | 승인 조회를 절대 믿음 → **벽** | 도구 기록만 봄 → **틈** (가설) |\n| **velog (230회+)** | \"종이 승인서\" 주장에 **71번 보관 성공** | 등록부를 직접 앎 → **76번 모두 UNSAFE** |", "- 50팀이 풀었다. 그런데 **공개된 풀이는 0편** — 누가 맞는지 아직 모른다\n- velog의 요령: 시도 제한(분당 4)이 빡빡하니, **심사 AI가 없는 13번**에서 가드를 먼저 떠봄\n\n<small>둘 다 못 풂 · 문제 인스턴스·시점이 달랐을 가능성도 있음 · velog 후기 · 우리 `_results/14.md`<\/small>"], "layout": "", "bonus": false, "title": "14. Judgeception — 벽과 틈이 뒤바뀌었다", "notes": "14번 Judgeception(저지셉션)은 관문이 셋입니다. 가드 AI가 검사하고, 실행 AI가 보관 도구를 쓰고, 마지막에 심사 AI가 SAFE(세이프)를 줘야 성공이에요.\n\n저희는 13번 시도하고 이렇게 정리했습니다. 실행 AI는 승인 조회를 절대 믿으니까 **벽**, 심사 AI는 도구 기록만 보니까 **틈**일 거다.\nvelog 팀은 230번 넘게 시도했는데 정반대를 봤어요. \"종이 승인서가 있다\"고 하니까 **보관은 71번 성공**. 그런데 심사 AI가 승인 등록부를 직접 알고 있어서 **76번 모두 UNSAFE(언세이프)**.\n저희가 벽이라 본 곳은 뚫렸고, 틈이라 본 곳이 벽이었습니다.\n*(▶ 클릭)*\n\n이 문제는 **50팀이 풀었습니다.** 그런데 공개된 풀이는 한 편도 없어요. 그래서 누가 맞는지 아직 모릅니다. 시점이나 인스턴스가 달랐을 수도 있고요.\nvelog 팀이 하나 영리했던 건, 시도 제한이 분당 4번으로 빡빡하니까 **같은 데스크인데 심사 AI가 없는 13번**에서 가드를 먼저 떠봤다는 겁니다. 비싼 시험장 대신 싼 시험장을 찾은 거죠.", "section": "[24:37] 3부 — 세 사건의 공통점 — 6.8분 (보너스 빼면 5.8분)"}, {"chunks": ["## 12. RAG Poisoner — 검색은 뚫었다\n\n| 관문 | 결과 |\n|---|---|\n| ① 내 문서가 검색 상위 3개에 들기 | ✅ 노골적 지시문은 오히려 **순위가 떨어짐**, 사무적 기록 문체가 잘 붙음 |\n| ② 모델(Claude Opus)이 도구 호출 | ❌ 문서 11종 모두 **호출 자체가 없음**. 거부 이유도 안 보임 |\n\n- 마지막 가설: \"새 결정\"이 아니라 \"**이미 승인된 결정의 집행**\"으로 → 검증 직전 대회 서버 모델 장애\n- **10팀**은 풀었다. 공개 풀이 없음\n\n<small>RAG = 검색해 온 문서를 붙여 답하게 하는 구조 · 우리 `_results/12.md`<\/small>"], "layout": "", "bonus": true, "title": "12. RAG Poisoner — 검색은 뚫었다", "notes": "*(보너스 — 시간이 없으면 슬라이드만 넘기세요)*\n\n12번 RAG Poisoner(래그 포이즈너)는 저희가 참조 문서 하나를 올리면, 서버가 숨은 질문으로 검색하고, 모델이 특정 도구를 실제로 호출하면 성공인 문제였습니다.\n\n첫 관문, 내 문서가 검색 상위 3개에 드는 건 금방 풀었어요. 오히려 노골적인 지시문을 넣으면 **검색 순위가 떨어져서** 탈락하고, 사무적인 기록 문체가 제일 잘 붙었습니다.\n두 번째 관문이 벽이었어요. 뒤의 모델이 Claude Opus(클로드 오퍼스)였는데, 문서를 열한 가지로 바꿔도 **도구를 아예 안 불렀습니다.** 마지막 가설을 검증하려는 순간 서버 쪽 모델이 죽었고요.\n이것도 열 팀은 풀었습니다. 공개 풀이는 없어요.", "section": "[24:37] 3부 — 세 사건의 공통점 — 6.8분 (보너스 빼면 5.8분)"}, {"chunks": ["## 나머지 넷 — 본 것, 시간, 환경, 추측\n\n<div class=\"quad\">\n<div><b>본 것을 설명해 버림<\/b>사건 3 · 격자 = \"벚꽃 배치\"<\/div>\n<div><b>시간<\/b>사건 2 · 돌파구 커밋이 종료 1분 뒤<\/div>\n<div><b>환경 (우리 탓 아님)<\/b>pip 차단 → torch 없음 → RidgeNet을 numpy로 재구현 · GPU 서버 다운 · 대회 서버 LLM 장애 (11·12·14·15)<\/div>\n<div><b>추측 제출<\/b>사건 3 · 근거 없는 플래그 9건<\/div>\n<\/div>\n\n잘한 점: 장애를 **엔드포인트별로 찔러** 우리 탓인지 구분해 기록 · 문제마다 `STATUS / 실패한 접근` 형식 유지\n\n> 에이전트가 **\"안 된다\"** 고 할 때, 그 문장의 **전제**를 사람이 다시 읽어야 한다."], "layout": "", "bonus": false, "title": "나머지 넷 — 본 것, 시간, 환경, 추측", "notes": "나머지 패턴 넷은 짧게 갑니다.\n\n본 걸 설명해 버린 것, 사건 3 격자. 시간, 사건 2의 17시 1분. 추측 제출, 사건 3의 아홉 번.\n그리고 환경. 이건 공정하게 말씀드려야 하는데요, 로컬 맥에서 프록시 때문에 pip(핍)가 막혀서 torch(토치)를 못 깔았습니다. 그래서 에이전트가 RidgeNet을 numpy(넘파이)로 통째로 다시 짰어요. GPU 서버는 대회 중에 내려갔고, 대회 서버 쪽 LLM(엘엘엠)도 오후에 11, 12, 14, 15번에서 계속 죽었습니다.\n\n잘한 점도 있어요. 장애가 우리 탓인지 아닌지를 에이전트가 엔드포인트(엔드포인트)별로 찔러서 구분해 기록했고, 문제마다 상태와 실패한 접근을 같은 형식으로 남겼습니다. 그 기록 덕분에 오늘 이 발표를 할 수 있었고요.\n\n3부를 한 문장으로 줄이면 이겁니다.\n**에이전트가 \"안 된다\"고 할 때, 그 문장의 전제를 사람이 다시 읽어야 한다.**\n그럼 에이전트를 어떻게 굴렸어야 했을까요. 4부입니다.", "section": "[24:37] 3부 — 세 사건의 공통점 — 6.8분 (보너스 빼면 5.8분)"}, {"chunks": ["# 4부. 에이전트를 굴리는 법\n\n그럼 어떻게 굴렸어야 했나"], "layout": "lead", "bonus": false, "title": "4부. 에이전트를 굴리는 법", "notes": "*(→ 바로 넘기세요)*", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["## 하루 14억 토큰\n\n<div class=\"huge sm\">14.2<span>억 토큰 · 약 $828<\/span><\/div>\n\n<p class=\"ask center\">이 중 \"앞의 대화를 다시 읽은\" 토큰이 아닌 건 몇 %일까요?<\/p>", "<div class=\"bar100\"><div class=\"cr\" style=\"width:98.6%\">Cache Read · 다시 읽기 <b>98.6%<\/b><\/div><div class=\"rest\" style=\"width:1.4%\"><\/div><\/div>\n<div class=\"barnote\">나머지 <b>1.4%<\/b> — 새 입력 · 출력 · 캐시 쓰기 전부<\/div>\n\n- KOTH 한 문제에 8억 8천만 · 메인 세션 하나가 **3억 6천만**\n- 한 줄 질문도 앞의 대화 전체를 **매 턴 다시** 읽는다\n\n<small>velog 팀(학생부 10위) 대회 당일 `ccusage` 측정값 · velog 4.1~4.2절 · Cache Read = 이미 읽은 앞부분을 캐시에서 다시 읽는 토큰 (싸지만 쌓이면 대부분)<\/small>"], "layout": "big", "bonus": false, "title": "하루 14억 토큰", "notes": "4부는 숫자 퀴즈로 시작하겠습니다.\nvelog 팀이 대회 당일 사용량을 ccusage(씨씨유시지)라는 집계 도구로 뽑아서 공개했어요. **하루에 14억 2천만 토큰**, API 가격으로 828달러쯤입니다.\n\n질문입니다. 이 14억 중에, \"앞의 대화를 다시 읽은\" 토큰이 **아닌** 건 몇 %일까요?\n*(▶ 클릭 — 공개 전 3초)*\n\n**1.4%입니다.** 98.6%가 Cache Read(캐시 리드)였어요.\n모델은 매 턴 대화 전체를 다시 입력으로 받습니다. 앞부분은 캐시에서 읽으니까 단가는 싸지만, 대화가 길어지면 그게 전부가 돼요. 새 입력, 출력, 캐시 쓰기를 다 합쳐도 1.4%입니다.\nKOTH 한 문제에 8억 8천만 토큰, 처음부터 이어 온 메인 세션 하나가 3억 6천만 토큰이었고요.\n\"지금 몇 번 제출했지?\" 같은 한 줄 질문도, 앞의 대화 전체를 매 턴 다시 읽는 값이 듭니다.", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["## 한도에 닿으면 생기는 일\n\n- Codex 토큰 소진(39라운드쯤) → Claude Code로 인계\n  → **인계 문서 없이** 넘겨서 새 세션이 상황 파악하다 **41라운드 마감을 놓침**\n- 사용 한도에 닿아 **세션들이 한꺼번에 멈춤**. 늘려도 소용없음 (victorica)\n- 백그라운드 에이전트 **42개** → 전부 끝난 건 **대회가 끝난 뒤**\n\n반대 사례\n- 인계 문서에 **\"반증된 가설, 재시도 금지\"** 표 → 새 세션이 같은 실험을 반복 안 함\n- 반복 절차를 `pipeline.py`로 → 맵 공개 후 **51초** 만에 후보 2개 검증\n\n> 단, \"재시도 금지\" 표는 양날의 검 — **틀린 금지**는 사건 1처럼 탐색을 막는다\n\n<small>velog 2.3·4.3절 · victorica 마무리<\/small>"], "layout": "", "bonus": false, "title": "한도에 닿으면 생기는 일", "notes": "그러니 한도에 닿습니다.\n\nvelog 팀은 39라운드쯤 Codex 토큰이 바닥나서 Claude Code로 넘겼는데, 급하게 넘기느라 인계 문서가 없었어요. 새 세션이 상황 파악하다가 **41라운드 마감을 놓쳤습니다.**\nvictorica 쪽은 사용 한도에 닿아서 세션들이 한꺼번에 멈췄대요. 세션을 늘려도 소용없었고요.\n그리고 웃픈 거 하나. 백그라운드 에이전트를 42개 띄웠는데 전부 끝난 게 **대회 끝난 뒤**였답니다.\n\n반대 사례도 있습니다. 인계 문서에 \"반증된 가설, 재시도 금지\" 표를 넣었더니 새 세션이 같은 실험을 반복 안 했대요. 그리고 반복 절차를 pipeline.py(파이프라인 파이) 하나로 묶었더니 맵이 공개되고 **51초 만에** 후보 두 개 검증이 끝났습니다.\n\n다만 이 \"재시도 금지\" 표는 양날의 검이에요. 사건 1에서 봤듯이 **틀린 금지는 탐색을 막습니다.**", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["## 학습 대신 손으로 짠 가중치\n\n**Neural Dominion**: 신경망으로 하는 땅따먹기. 제출물 = **가중치 파일** 하나, 10분마다 라운드\n\n- 강화학습 할 시간이 없다 → **학습 안 함**\n- 가중치를 크게 줘서 뉴런을 **켜짐/꺼짐 스위치**로 → 경로를 **신경망에 컴파일**\n- 예시 모델 ~170칸 → 첫 시험 **4,000칸+**\n\n**로컬 점수를 믿지 마라**\n- 로컬 0.716점 → 실전 **0.10점** → \"**실전에서 이미 살아남은 경로**\"를 재사용\n- 벽돌깨기: 로컬 평가에 응답 시간이 없어 실서버 제한에 걸림 → **p99 응답 시간**을 지표에\n\n<small>velog 2장 · victorica 4절<\/small>"], "layout": "", "bonus": true, "title": "학습 대신 손으로 짠 가중치", "notes": "*(보너스 — 시간이 없으면 슬라이드만 넘기세요)*\n\nKOTH에서 재밌는 발상 하나. Neural Dominion(뉴럴 도미니언)은 신경망으로 하는 땅따먹기인데, 제출물이 정해진 구조의 가중치 파일 하나였어요.\n강화학습을 해야 할 것 같죠. 그런데 10분마다 라운드가 오니까 학습할 시간이 없습니다. 그래서 velog 팀은 **학습을 안 했어요.** 가중치를 크게 줘서 뉴런을 켜짐 아니면 꺼짐인 스위치로 만들고, \"0턴엔 오른쪽, 43턴엔 아래\" 같은 경로를 신경망 안에 그대로 컴파일했습니다. 예시 모델이 170칸 먹을 때 첫 시험에 4,000칸을 먹었대요.\n\n교훈이 하나 더 있습니다. 로컬 시뮬레이터에서 0.716점 나온 모델이 실전에선 0.10점이었어요. 그래서 마지막엔 \"**실전에서 이미 살아남은 경로**\"를 가져다 썼습니다. victorica의 벽돌깨기도 로컬 평가에 응답 시간이 없어서 실서버 시간 제한에 걸렸고, 그 뒤로 p99(피 나인티나인) 응답 시간을 지표에 넣었대요.", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["## 규칙은 문서가 아니라 훅으로\n\n| 방식 | 결과 |\n|---|---|\n| CLAUDE.md 맨 위에 \"준비된 도구부터 돌려라\" | 에이전트가 **두 번 연속 무시**, curl로 즉흥 탐색 |\n| 메시지마다 **훅**으로 같은 규칙 자동 주입 | 첫 도구만 정해 주면 그 뒤는 알아서 이어감 |\n\n<div class=\"chain\"><span>사람의 메시지<\/span><i>→<\/i><span class=\"hot\">UserPromptSubmit 훅<br><small>규칙을 매번 끼워 넣음<\/small><\/span><i>→<\/i><span>에이전트<\/span><i>→<\/i><span>준비된 도구부터<\/span><\/div>\n\n- **\"어떻게\"는 에이전트, \"무엇부터\"는 사람**\n- 플래그 제출 버튼은 **사람만** (victorica, 그리고 우리 팀도 \"제출 금지 · 보고만\")\n\n<small>CLAUDE.md = Claude Code가 세션 시작 때 읽는 규칙 파일 · UserPromptSubmit = 사용자 메시지마다 실행되는 Claude Code 훅 · victorica 1·2절<\/small>"], "layout": "", "bonus": false, "title": "규칙은 문서가 아니라 훅으로", "notes": "victorica 후기에서 제일 실용적인 부분입니다.\n\nCLAUDE.md(클로드 엠디), Claude Code가 세션 시작 때 읽는 규칙 파일 맨 위에 \"준비된 도구부터 돌려라\"를 최우선 규칙으로 적어 뒀대요. 에이전트가 **두 번 연속 무시하고** curl(컬)로 이것저것 찔러 봤답니다.\n\n그래서 규칙을 더 세게 쓰는 대신 방식을 바꿨어요. 메시지를 보낼 때마다 자동으로 실행되는 훅(훅), UserPromptSubmit(유저 프롬프트 서브밋) 훅으로 그 규칙을 매번 끼워 넣었습니다. 에이전트가 읽을지 말지 고를 수 없게요. 그랬더니 첫 도구만 정해 주면 그 뒤는 알아서 이어 갔대요.\n\n기준은 이겁니다. **\"어떻게\"는 에이전트에게, \"무엇부터\"는 사람이.**\n그리고 플래그 제출 버튼은 사람만 누르게 막았습니다. 저희 팀도 \"제출하지 말고 보고만 해라\"를 규칙으로 뒀었고요.", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["## 여러분이라면, A? B?\n\n**Neural Dominion 마지막 라운드** — 누적 4위, 3위와 19점 차\n\n<div class=\"vote\">\n<div class=\"opt\"><div class=\"l\">A 안정형<\/div><div class=\"s\">예상 0.77<\/div><p>꼬리 짧음 · 4번 중 3번 생존<\/p><\/div>\n<div class=\"opt agent\"><div class=\"l\">B 공격형<\/div><div class=\"s\">예상 1.11<\/div><p>꼬리 김 · 크게 먹거나 잘리거나<\/p><div class=\"pick\">에이전트 추천<\/div><\/div>\n<\/div>", "<p class=\"ask center\">사람이 <b>A<\/b>를 골랐다 → 라운드 1위 → <b>종합 3위<\/b><\/p>\n\n필요한 건 높은 점수가 아니라 **1등**이었다.\n\n<small>velog 2.3절 · 꼬리 = 내 땅 밖으로 나가 있는 동안 남는 자취. 밟히면 죽음<\/small>"], "layout": "", "bonus": false, "title": "여러분이라면, A? B?", "notes": "*(→ 실제로 손을 들게 하세요. \"A라고 생각하시는 분? B?\" — 10초)*\n\n이번엔 여러분이 골라 보세요.\n\nvelog 팀 KOTH 마지막 라운드입니다. 누적 4위, 3위와 19점 차이.\n후보가 둘 있어요. A 안정형은 예상 점수 0.77, 꼬리를 짧게 빼서 네 번 중 세 번 살아남습니다. B 공격형은 1.11, 꼬리를 길게 빼서 크게 먹거나 잘려서 죽거나.\n**에이전트는 B를 추천했습니다.** 기대 점수가 높으니까요.\n\nA라고 생각하시는 분? B는요?\n*(▶ 클릭)*\n\n사람이 **A**를 골랐습니다. 결과는 라운드 1위, **종합 3위.**\n이 대회는 라운드 1등만 하면 점수가 더 높아도 추가 점수가 없고, 대신 죽으면 순위가 확 떨어지는 구조였거든요.\n**필요한 건 높은 점수가 아니라 1등이었습니다.**", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["## SHIFT — 에이전트가 놓친 공식\n\n에이전트는 사격 거리 · 회피 반경을 계속 조정 → 순위가 안 오름", "<div class=\"formula\">점수 ≈ 100 / √순위<\/div>\n\n순위는 **살아남은 순서**. 그런데 우리 전차는 끝까지 산 적이 없었다", "사격을 통째로 빼고 **\"무교전 생존\"** → 81 · 105 · 72위 → **52위**\n\n> 숫자 조정이 안 먹히면, **채점 함수부터** 다시 본다.\n\n<small>victorica 4절 · 공식은 글쓴이가 라운드별 순위·점수를 나란히 놓고 역산한 것<\/small>"], "layout": "big", "bonus": false, "title": "SHIFT — 에이전트가 놓친 공식", "notes": "비슷한 얘기 하나 더. victorica 쪽 SHIFT(시프트)라는 전차 게임입니다.\n에이전트가 사격 거리, 회피 반경 같은 숫자를 계속 조정하는데 순위가 안 올랐대요.\n*(▶ 클릭)*\n\n사람이 라운드별 순위랑 점수를 나란히 놓고 봤더니, 점수가 거의 정확히 **100 나누기 루트 순위**였습니다.\n*(▶ 클릭)*\n\n그리고 순위는 **살아남은 순서**였어요. 그런데 자기 전차는 끝까지 산 적이 한 번도 없었습니다. 조준을 아무리 잘해도 점수엔 0이었던 거죠.\n그래서 사격을 통째로 빼고 \"무교전 생존\"으로 바꿨더니 81위, 105위, 72위 하던 게 52위로 올랐습니다.\n\n**숫자 조정이 안 먹히면, 채점 함수부터 다시 본다.**\n에이전트는 주어진 숫자를 열심히 올립니다. 그 숫자가 맞는 숫자인지는 사람이 봐야 해요.", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["## 그래도 결국 자본 싸움?\n\n> \"얼마나 좋은 모델을, 얼마나 오래 돌릴 수 있느냐가 그대로 전력이 됐다.\"\n> \"그래도 같은 모델로도, 규칙을 훅으로 강제했는지에 따라 헤매는 시간이 달랐다.\"\n\n<div class=\"hbars\">\n<div class=\"hb\"><span class=\"lab\">토큰<\/span><div class=\"track\"><div class=\"b a\" style=\"width:54.4%\">velog 팀 14.2억<\/div><\/div><\/div>\n<div class=\"hb\"><span class=\"lab\"><\/span><div class=\"track\"><div class=\"b z\" style=\"width:100%\">\"1등\" 팀 26.1억 <i>×1.8<\/i><\/div><\/div><\/div>\n<div class=\"hb\"><span class=\"lab\">비용<\/span><div class=\"track\"><div class=\"b a\" style=\"width:35.2%\">$828<\/div><\/div><\/div>\n<div class=\"hb\"><span class=\"lab\"><\/span><div class=\"track\"><div class=\"b z\" style=\"width:100%\">$2,353 — 그중 Codex 87% <i>×2.8<\/i><\/div><\/div><\/div>\n<\/div>\n\n<small>인용 둘 다 victorica 후기 요지 · 1등 팀 수치는 그 팀 참가자가 대회 디스코드에 직접 올린 표 (KOTH 1등인지 종합 1등인지 불명, 측정 방식 미기재) · velog 4.1절<\/small>"], "layout": "", "bonus": false, "title": "그래도 결국 자본 싸움?", "notes": "마지막으로 불편한 얘기.\n\nvictorica는 후기를 이렇게 맺었습니다. 얼마나 좋은 모델을 얼마나 오래 돌릴 수 있느냐가 그대로 전력이었다. 그런데 같은 글에, 같은 모델이라도 규칙을 훅으로 강제했는지에 따라 헤매는 시간이 달랐다는 문장도 있어요.\n\n숫자로 보면, 대회 디스코드(디스코드)에 \"1등\" 팀 참가자가 자기 팀 사용량을 올렸습니다. **26억 토큰, 2,353달러.** velog 팀 대비 토큰은 1.8배인데 돈은 2.8배예요. 비싼 모델을 더 많이 썼다는 뜻이고, 그중 87%가 Codex였습니다.\n다만 이게 KOTH 1등인지 종합 1등인지는 캡처만으론 확실치 않고, 본인이 올린 숫자라는 것도 감안해 주세요.\n\n저는 두 문장이 다 맞다고 봅니다. 그런데 오늘 2부, 3부에서 본 건 결국 뒤쪽 얘기였어요. 저희 에이전트도 계산은 충분히 했습니다. **어느 전제를 의심할지를 못 골랐을 뿐이에요.**", "section": "[31:22] 4부 — 에이전트를 굴리는 법 — 8.7분 (보너스 빼면 7.4분)"}, {"chunks": ["# 5부. 그래서 다음엔"], "layout": "lead", "bonus": false, "title": "5부. 그래서 다음엔", "notes": "*(→ 바로 넘기세요)*", "section": "[40:03] 5부 — 그래서 다음엔 — 2.5분"}, {"chunks": ["## 체크리스트 다섯 줄\n\n| | 다음엔 | 오늘의 사건 |\n|---|---|---|\n| 1 | 에이전트의 **\"불가능 / 유일한 길\"** 에는 **전제 한 줄**을 같이 쓰게 하고, 사람이 그 전제를 본다 | 사건 1 · 2 · 11 |\n| 2 | 인계 문서의 \"재시도 금지\"에는 **기각 근거**까지 넘긴다 | 사건 1 |\n| 3 | 같은 일 두 번이면 **스크립트로**. 에이전트에겐 원본 대신 **요약**을 | 98.6% |\n| 4 | 규칙은 **훅으로**, 제출은 **사람이** | victorica |\n| 5 | 시작하자마자 **채점 함수를 역산**한다 | SHIFT · A/B |\n\n덤: 에이전트가 **\"이건 그냥 ○○일 뿐\"** 하고 넘어가는 순간을 사람이 한 번 더 본다 — 사건 3"], "layout": "", "bonus": false, "title": "체크리스트 다섯 줄", "notes": "다음 대회를 위해 다섯 줄로 정리했습니다. 오른쪽 칸이 오늘 본 사건이에요.\n\n첫째, 에이전트가 \"불가능하다\", \"길은 하나뿐이다\"라고 하면 **전제를 한 줄로 같이 쓰게 하고, 사람이 그 전제를 봅니다.** 오늘 하나만 가져가신다면 이겁니다. 사건 1, 사건 2, 11번이 다 여기 걸려요.\n둘째, 인계 문서의 \"재시도 금지\" 표에는 결론만 말고 **왜 기각했는지**도 넘깁니다. 그래야 다음 세션이 전제를 다시 볼 수 있어요.\n셋째, 같은 일 두 번이면 스크립트로. 에이전트한테는 원본 대신 요약을. 98.6%가 거기서 샜으니까요.\n넷째, 규칙은 훅으로, 제출은 사람이.\n다섯째, 시작하자마자 채점 함수부터 역산합니다. SHIFT랑 A/B 선택이 그랬죠.\n\n그리고 사건 3처럼 \"봤는데 설명해 버린 것\"은 체크리스트로 막기가 어렵더라고요. 그래서 덤으로, 에이전트가 **\"이건 그냥 ○○일 뿐\"이라고 넘어가는 순간**을 사람이 한 번 더 보는 게 좋겠습니다.\n\n하나 더 보태면, 사건 2에서 에이전트는 \"98팀이 풀었다\"를 봤습니다. 많은 팀이 풀었다는 숫자는 **내 전제를 의심하라는 신호**로 읽어야 했어요.", "section": "[40:03] 5부 — 그래서 다음엔 — 2.5분"}, {"chunks": ["## 아직 아무도 쓰지 않은 4문제\n\n| 문제 | 푼 팀 | 아는 것 |\n|---|---|---|\n| 14 Judgeception | **50팀** | 우리 13회 + velog 230회+. 관측이 서로 반대 |\n| 15 Chain of Agents | 13팀 | 우리는 손도 못 댐 |\n| 12 RAG Poisoner | 10팀 | 검색은 뚫림. 모델이 도구를 **아예 안 부름** |\n| 17 BATTLE | KOTH | 공개 글 없음 |\n\n> 푼 팀은 있다. **아무도 쓰지 않았을 뿐.**\n\n감사합니다. 질문 받겠습니다.\n\n<small>푼 팀 수는 종료 31분 전 API 값<\/small>"], "layout": "", "bonus": false, "title": "아직 아무도 쓰지 않은 4문제", "notes": "마지막 장입니다.\n\n이 네 문제는 공개된 풀이가 아직 없습니다. 그런데 푼 팀 수를 보세요. 14번 Judgeception은 50팀, 15번 Chain of Agents(체인 오브 에이전츠)는 13팀, 12번 RAG Poisoner(래그 포이즈너)는 10팀이 풀었습니다.\n\n**푼 팀은 있습니다. 아무도 쓰지 않았을 뿐이에요.**\n혹시 이 풀이를 보시게 되면 저한테도 꼭 알려 주세요.\n\n오늘 처음에 보여 드린 문장, \"정보이론적으로 막혀 있음, 정량 증명.\" 다음 대회에서 에이전트가 이런 문장을 쓰면, 저는 이제 푼 팀 수부터 볼 겁니다.\n\n감사합니다. 질문 받겠습니다.", "section": "[40:03] 5부 — 그래서 다음엔 — 2.5분"}]</script>
<script>
(async function () {
  const SLIDES = JSON.parse(document.getElementById('deck-data').textContent);
  const stage = document.getElementById('stage');
  const N = SLIDES.length;

  const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  marked.use({ gfm: true, breaks: true, renderer: {
    code(code, lang) {
      if ((lang || '').trim() === 'mermaid') return '<pre class="mermaid">' + esc(code) + '</pre>';
      return '<pre><code>' + esc(code) + '</code></pre>';
    },
    image(href, title, text) {
      const m = /^w:(\d+)$/.exec(text || '');
      const src = /^(https?:|\/|\.\.\/)/.test(href) ? href : '../' + href;
      return '<img src="' + src + '" alt="' + (m ? '' : esc(text || '')) + '"' + (m ? ' style="width:' + m[1] + 'px"' : '') + '>';
    },
    link(href, title, text) { return '<a href="' + href + '" target="_blank" rel="noopener">' + text + '</a>'; }
  }});

  SLIDES.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide';
    if (s.layout) el.classList.add(s.layout);
    el.dataset.i = i;
    const body = document.createElement('div'); body.className = 'body';
    const inner = document.createElement('div'); inner.className = 'inner';
    s.chunks.forEach((c, k) => {
      const d = document.createElement('div');
      d.innerHTML = marked.parse(c);
      if (k > 0) { d.className = 'frag hidden'; d.dataset.k = k; }
      inner.appendChild(d);
    });
    body.appendChild(inner);
    const foot = document.createElement('div'); foot.className = 'foot';
    inner.querySelectorAll('p').forEach(p => {
      const kids = [...p.childNodes].filter(n => !(n.nodeType === 3 && !n.textContent.trim()) && n.nodeName !== 'BR');
      if (kids.length && kids.every(n => n.nodeName === 'SMALL')) foot.appendChild(p);
    });
    el.appendChild(body);
    if (foot.children.length) el.appendChild(foot);
    if (s.bonus) { const b = document.createElement('div'); b.className = 'badge'; b.textContent = '보너스'; el.appendChild(b); }
    if (s.chunks.length > 1) {
      const dots = document.createElement('div'); dots.className = 'stepdots';
      for (let k = 0; k < s.chunks.length; k++) dots.appendChild(document.createElement('i'));
      el.appendChild(dots);
    }
    const num = document.createElement('div'); num.className = 'num'; num.textContent = (i + 1) + ' / ' + N; el.appendChild(num);
    stage.appendChild(el);
  });

  try { await document.fonts.ready; } catch (e) {}
  mermaid.initialize({
    startOnLoad: false, theme: 'neutral', securityLevel: 'loose',
    flowchart: { htmlLabels: true, useMaxWidth: true, padding: 10, nodeSpacing: 26, rankSpacing: 32 },
    themeVariables: { fontFamily: 'Pretendard, Apple SD Gothic Neo, sans-serif', fontSize: '21px',
      primaryColor: '#f8fafc', primaryBorderColor: '#64748b', primaryTextColor: '#0f172a', lineColor: '#475569' }
  });
  try { await mermaid.run({ querySelector: '.slide pre.mermaid' }); } catch (e) { console.error('mermaid', e); }
  stage.querySelectorAll('pre.mermaid svg').forEach(svg => {
    const vb = svg.viewBox && svg.viewBox.baseVal;
    if (!vb || !vb.width) return;
    const w = Math.min(1152, vb.width * 1.3);
    svg.style.maxWidth = w + 'px'; svg.style.width = w + 'px';
  });

  // 넘치는 장: 숨은 조각까지 포함한 전체 높이로 맞춤 (조각이 나타나도 흔들리지 않게)
  const imgs = [...stage.querySelectorAll('img')];
  await Promise.all(imgs.map(im => im.complete ? 0 : new Promise(r => { im.onload = im.onerror = r; })));
  function fit(el) {
    const body = el.querySelector('.body'), inner = el.querySelector('.inner');
    if (el.classList.contains('lead') || el.classList.contains('cover')) return 1;
    inner.style.transform = ''; inner.style.width = '';
    const avail = body.clientHeight, W = body.clientWidth;
    let s = 1;
    while (s > 0.5) {
      inner.style.width = (W / s) + 'px';
      inner.style.transform = s < 1 ? 'scale(' + s + ')' : '';
      if (inner.scrollHeight * s <= avail + 1 && inner.scrollWidth * s <= W + 1) break;
      s = Math.round((s - 0.02) * 100) / 100;
    }
    el.dataset.scale = s;
    return s;
  }
  stage.querySelectorAll('.slide').forEach(fit);

  function scaleStage() {
    const vp = document.getElementById('viewport');
    stage.style.transform = 'scale(' + Math.min(vp.clientWidth / 1280, vp.clientHeight / 720) + ')';
  }
  window.addEventListener('resize', scaleStage);

  const notesEl = document.getElementById('notes');
  const hud = document.getElementById('hud');
  let cur = 0, step = 0;
  const maxStep = i => SLIDES[i].chunks.length - 1;

  function paint() {
    const el = stage.children[cur];
    el.querySelectorAll('.frag').forEach(f => f.classList.toggle('hidden', +f.dataset.k > step));
    el.querySelectorAll('.stepdots i').forEach((d, k) => d.classList.toggle('on', k <= step));
    const s = SLIDES[cur], nx = SLIDES[cur + 1], ms = maxStep(cur);
    const left = ms - step;
    hud.textContent = (cur + 1) + ' / ' + N + (ms ? '  ·  공개 ' + step + '/' + ms : '') + '   ·   S: 노트';
    notesEl.innerHTML = '<div class="meta"><span class="sec">' + esc(s.section || '') + '</span><span class="ttl">' + (cur + 1) + ' / ' + N + ' · ' + esc(s.title || '') + '</span>'
      + (ms ? '<span class="step">▶ 남은 공개 ' + left + '</span>' : '')
      + '<span class="next">다음: ' + (left > 0 ? '(같은 장 공개)' : (nx ? esc(nx.title) : '—')) + '</span></div>'
      + (s.notes ? marked.parse(s.notes) : '<p><em>(노트 없음)</em></p>');
  }
  function go(i, atEnd) {
    i = Math.max(0, Math.min(N - 1, i));
    stage.children[cur].classList.remove('active');
    cur = i; step = atEnd ? maxStep(i) : 0;
    stage.children[cur].classList.add('active');
    notesEl.scrollTop = 0;
    paint();
    if (location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
  }
  function next() { if (step < maxStep(cur)) { step++; paint(); } else if (cur < N - 1) go(cur + 1); }
  function prev() { if (step > 0) { step--; paint(); } else if (cur > 0) go(cur - 1, true); }
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || (k === ' ' && !e.shiftKey) || k === 'Enter') { next(); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp' || (k === ' ' && e.shiftKey) || k === 'Backspace') { prev(); e.preventDefault(); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(N - 1, true);
    else if (k === 's' || k === 'S' || k === 'ㄴ') { document.body.classList.toggle('notes-on'); scaleStage(); }
  });
  stage.addEventListener('click', e => { if (!e.target.closest('a')) next(); });
  window.addEventListener('hashchange', () => { const n = parseInt(location.hash.slice(1), 10); if (n && n - 1 !== cur) go(n - 1, true); });

  const start = parseInt(location.hash.slice(1), 10);
  stage.children[0].classList.add('active');
  go(start ? start - 1 : 0, !!start);
  scaleStage();
  window.__deck = { go, next, prev, fit, N, get cur() { return cur; }, get step() { return step; } };
  document.body.dataset.ready = '1';
})();
</script>
</body>
</html>
